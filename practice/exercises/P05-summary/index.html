<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>家計簿</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <h1>家計簿</h1>

    <section class="panel">
      <h2>明細を追加する</h2>
      <form id="entry-form">
        <label>種別
          <select id="kind">
            <option value="expense">支出</option>
            <option value="income">収入</option>
          </select>
        </label>
        <label>日付 <input id="date" type="date" /></label>
        <label>金額 <input id="amount" inputmode="numeric" autocomplete="off" /></label>
        <label id="category-field">分類 <select id="category"></select></label>
        <label id="source-field">入金元 <input id="source" autocomplete="off" /></label>
        <label>メモ <input id="memo" autocomplete="off" /></label>
        <button>追加</button>
      </form>
      <p id="category-status" class="status"></p>
      <ul id="form-errors" class="errors"></ul>
    </section>

    <section class="panel">
      <h2>集計</h2>
      <div class="filters">
        <label>月 <select id="filter-month"></select></label>
        <label>種別
          <select id="filter-kind">
            <option value="all">すべて</option>
            <option value="income">収入</option>
            <option value="expense">支出</option>
          </select>
        </label>
      </div>
      <dl class="totals">
        <dt>収入</dt><dd id="total-income"></dd>
        <dt>支出</dt><dd id="total-expense"></dd>
        <dt>収支</dt><dd id="balance"></dd>
      </dl>
      <h3>分類ごとの支出</h3>
      <ul id="category-totals" class="plain-list"></ul>
      <h3>入金元ごとの収入</h3>
      <ul id="source-totals" class="plain-list"></ul>
    </section>

    <section class="panel">
      <h2>明細</h2>
      <ul id="entry-list" class="entries"></ul>
      <p id="empty-message" class="status">明細はまだありません。</p>
    </section>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
