<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 340" width="770" height="340" role="img" aria-labelledby="t d">
  <title id="t">起動の流れと、操作のたびに回る輪</title>
  <desc id="d">上の段は起動の流れで、1 回だけ通る。index.html の script から main.ts が実行され、getElements で要素を取得し、loadEntries で localStorage から明細を読み、createInitialState で最初の状態を作る。イベントの処理を登録してから、render で最初の画面を作る（分類は読み込み中）。loadCategories が分類を読み込み終わると、setCategories で新しい状態を作って update を呼ぶ。下の段は操作のたびに回る輪。update が状態を入れ替え、render が画面を作り直す。画面で操作すると、登録したイベントの処理が state.ts の関数で新しい状態を作り、また update を呼ぶ。update は、明細が変わったときだけ saveEntries で localStorage に保存する。</desc>
  <style>
    .txt { fill: #1f2937; font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; font-size: 13px; }
    .sub { fill: #4b5563; font-size: 11.5px; }
    .head { font-weight: 700; }
    .code { fill: #1f2937; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; }
    .small { font-size: 11.5px; }
    .var { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
    .obj { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
    .save { fill: #f8fafc; stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 5 3; }
    .line { fill: none; stroke: #2563eb; stroke-width: 1.8; }
    .line2 { fill: none; stroke: #64748b; stroke-width: 1.8; }
    .tip { fill: #2563eb; }
    .tip2 { fill: #64748b; }
    @media (prefers-color-scheme: dark) {
      .txt, .code { fill: #e5e7eb; }
      .sub { fill: #9ca3af; }
      .var { fill: #1e293b; stroke: #64748b; }
      .obj { fill: #172554; stroke: #60a5fa; }
      .save { fill: #1e293b; stroke: #94a3b8; }
      .line { stroke: #60a5fa; }
      .line2 { stroke: #94a3b8; }
      .tip { fill: #60a5fa; }
      .tip2 { fill: #94a3b8; }
    }
  </style>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="tip" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="tip2" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <!-- 起動（1 回だけ） -->
  <text class="txt sub" x="20" y="22">起動（1 回だけ）</text>
  <rect class="var" x="20" y="32" width="88" height="58" rx="8"/>
  <text class="code small" x="64" y="57" text-anchor="middle">index.html</text>
  <text class="txt sub" x="64" y="77" text-anchor="middle">→ main.ts</text>
  <path class="line2" d="M108,61 L120,61" marker-end="url(#a2)"/>
  <rect class="var" x="124" y="32" width="196" height="58" rx="8"/>
  <text class="code small" x="134" y="51">getElements</text>
  <text class="code small" x="134" y="67">loadEntries（localStorage）</text>
  <text class="code small" x="134" y="83">→ createInitialState</text>
  <path class="line2" d="M320,61 L332,61" marker-end="url(#a2)"/>
  <rect class="var" x="336" y="32" width="104" height="58" rx="8"/>
  <text class="txt" x="388" y="57" text-anchor="middle">イベントの</text>
  <text class="txt" x="388" y="75" text-anchor="middle">処理を登録</text>
  <path class="line2" d="M440,61 L452,61" marker-end="url(#a2)"/>
  <rect class="var" x="456" y="32" width="108" height="58" rx="8"/>
  <text class="code" x="510" y="57" text-anchor="middle">render</text>
  <text class="txt sub" x="510" y="77" text-anchor="middle">分類は読み込み中</text>
  <path class="line2" d="M564,61 L576,61" marker-end="url(#a2)"/>
  <rect class="var" x="580" y="32" width="154" height="58" rx="8"/>
  <text class="code" x="657" y="57" text-anchor="middle">loadCategories</text>
  <text class="txt sub" x="657" y="77" text-anchor="middle">分類を読み込む</text>
  <path class="line2" d="M657,90 L657,170" marker-end="url(#a2)"/>
  <text class="txt sub" x="665" y="124">終わったら</text>
  <text class="code small" x="665" y="141">setCategories</text>

  <!-- 保存 -->
  <rect class="save" x="300" y="110" width="232" height="44" rx="8"/>
  <text class="code small" x="416" y="130" text-anchor="middle">saveEntries → localStorage</text>
  <text class="txt sub" x="416" y="147" text-anchor="middle">明細が変わったときだけ保存</text>
  <path class="line2" d="M594,174 C578,160 556,142 536,136" marker-end="url(#a2)"/>

  <!-- 操作のたびに回る輪 -->
  <rect class="obj" x="580" y="174" width="154" height="54" rx="8"/>
  <text class="code head" x="657" y="197" text-anchor="middle">update(next)</text>
  <text class="txt sub" x="657" y="216" text-anchor="middle">状態を入れ替える</text>
  <path class="line" d="M657,228 L657,266" marker-end="url(#a1)"/>
  <rect class="obj" x="580" y="270" width="154" height="54" rx="8"/>
  <text class="code head" x="657" y="293" text-anchor="middle">render</text>
  <text class="txt sub" x="657" y="312" text-anchor="middle">画面を作り直す</text>
  <path class="line" d="M580,297 L500,297" marker-end="url(#a1)"/>
  <rect class="var" x="326" y="270" width="170" height="54" rx="8"/>
  <text class="txt head" x="411" y="293" text-anchor="middle">画面</text>
  <text class="txt sub" x="411" y="312" text-anchor="middle">一覧・集計・フォーム</text>
  <path class="line" d="M326,297 L266,297" marker-end="url(#a1)"/>
  <rect class="var" x="20" y="270" width="244" height="54" rx="8"/>
  <text class="txt head" x="142" y="293" text-anchor="middle">操作</text>
  <text class="txt sub" x="142" y="312" text-anchor="middle">登録したイベントの処理が動く</text>
  <path class="line" d="M142,270 L142,232" marker-end="url(#a1)"/>
  <rect class="obj" x="20" y="174" width="244" height="54" rx="8"/>
  <text class="code head" x="142" y="197" text-anchor="middle">state.ts の関数</text>
  <text class="txt sub" x="142" y="216" text-anchor="middle">addEntry などで新しい状態を作る</text>
  <path class="line" d="M264,201 L576,201" marker-end="url(#a1)"/>
  <text class="txt sub" x="411" y="252" text-anchor="middle">操作のたびに、この輪を回る</text>
</svg>
