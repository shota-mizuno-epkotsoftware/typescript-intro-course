  <text class="pg ctl" x="22" y="216"></text>
  <rect class="mark" x="16" y="201.5" width="112" height="19" rx="3"/>
  <text class="pg ctl" x="22" y="237">娯楽</text>
  <text class="pg ctl" x="22" y="258">食費</text>
  <rect class="mark" x="16" y="243.5" width="112" height="19" rx="3"/>
  <text class="pg ctl" x="22" y="279">その他</text>
  <text class="pg lbl" x="422" y="55">分類</text>
  <rect class="ctrl" x="422" y="60" width="96" height="28" rx="4.8"/>
  <text class="pg ctl" x="428" y="78">食費</text>
  <path class="chev" d="M503,72 L506.5,75.5 L510,72"/>
  <rect class="ctrl" x="422" y="92" width="120" height="113" rx="4.8"/>
  <rect class="hl" x="425" y="95" width="114" height="21" rx="3"/>
  <text class="pg ctl" x="432" y="111">食費</text>
  <text class="pg ctl" x="432" y="132">交通費</text>
  <text class="pg ctl" x="432" y="153">日用品</text>
  <text class="pg ctl" x="432" y="174">娯楽</text>
  <text class="pg ctl" x="432" y="195">その他</text>
  <path class="lead" d="M128,147 H170"/>
  <text class="note" x="176" y="151">数の 100</text>
  <path class="lead" d="M128,189 H170"/>
  <path class="lead" d="M128,210 H170"/>
  <text class="note" x="176" y="204">空白の選択肢が 2 つ</text>
  <path class="lead" d="M128,252 H170"/>
  <text class="note" x="176" y="256">2 つ目の「食費」</text>
  <path class="flow" d="M330,150 L400,150"/>
  <path class="flow-head" d="M400,150 L393.7,153.0 L393.7,147.0 Z"/>
