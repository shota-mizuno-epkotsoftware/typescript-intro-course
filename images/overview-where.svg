<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 246" width="760" height="246" role="img" aria-labelledby="t d">
  <title id="t">コードはどこで動くか</title>
  <desc id="d">左がブラウザ（利用者のパソコン）で、この講座が扱う所（フロントエンド）。HTML が画面の部品、CSS が見た目、JavaScript が動きを担い、JavaScript は DOM を通して HTML の部品を読み書きする。右がサーバー（バックエンド）で、PHP や Node.js が動く。Node.js は、この講座では自分のパソコンで使う。ブラウザとサーバーは、通信でページやデータをやり取りする。</desc>
  <style>
    .txt { fill: #1f2937; font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; font-size: 13px; }
    .sub { fill: #4b5563; font-size: 11.5px; }
    .head { font-weight: 700; }
    .area { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
    .area2 { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
    .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.2; }
    .key { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.5; }
    .line { fill: none; stroke: #2563eb; stroke-width: 1.8; }
    .line2 { fill: none; stroke: #64748b; stroke-width: 1.8; }
    .tip { fill: #2563eb; }
    .tip2 { fill: #64748b; }
    @media (prefers-color-scheme: dark) {
      .txt { fill: #e5e7eb; }
      .sub { fill: #9ca3af; }
      .area { fill: #172554; stroke: #60a5fa; }
      .area2 { fill: #1e293b; stroke: #64748b; }
      .box { fill: #0f172a; stroke: #64748b; }
      .key { fill: #1e3a8a; stroke: #60a5fa; }
      .line { stroke: #60a5fa; }
      .line2 { stroke: #94a3b8; }
      .tip { fill: #60a5fa; }
      .tip2 { fill: #94a3b8; }
    }
  </style>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="tip" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="tip2" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <!-- ブラウザ -->
  <rect class="area" x="20" y="20" width="440" height="208" rx="10"/>
  <text class="txt head" x="38" y="46">ブラウザ（利用者のパソコン）</text>
  <text class="txt sub" x="38" y="66">この講座が扱う所（フロントエンド）</text>

  <rect class="box" x="40" y="86" width="150" height="46" rx="8"/>
  <text class="txt head" x="115" y="106" text-anchor="middle">HTML</text>
  <text class="txt sub" x="115" y="123" text-anchor="middle">画面の部品</text>
  <rect class="box" x="40" y="148" width="150" height="46" rx="8"/>
  <text class="txt head" x="115" y="168" text-anchor="middle">CSS</text>
  <text class="txt sub" x="115" y="185" text-anchor="middle">見た目</text>

  <rect class="key" x="280" y="124" width="160" height="56" rx="8"/>
  <text class="txt head" x="360" y="147" text-anchor="middle">JavaScript</text>
  <text class="txt sub" x="360" y="166" text-anchor="middle">動き</text>
  <path class="line" d="M278,140 L194,116" marker-end="url(#a1)" marker-start="url(#a1)"/>
  <text class="txt sub" x="244" y="110" text-anchor="middle">DOM で読み書き</text>

  <!-- 通信 -->
  <path class="line2" d="M462,160 L516,160" marker-end="url(#a2)" marker-start="url(#a2)"/>
  <text class="txt sub" x="489" y="149" text-anchor="middle">通信</text>

  <!-- サーバー -->
  <rect class="area2" x="520" y="20" width="220" height="208" rx="10"/>
  <text class="txt head" x="538" y="46">サーバー</text>
  <text class="txt sub" x="538" y="66">バックエンド</text>
  <rect class="box" x="540" y="86" width="180" height="46" rx="8"/>
  <text class="txt head" x="630" y="106" text-anchor="middle">PHP</text>
  <text class="txt sub" x="630" y="123" text-anchor="middle">これまで学んだ言語</text>
  <rect class="box" x="540" y="148" width="180" height="62" rx="8"/>
  <text class="txt head" x="630" y="168" text-anchor="middle">Node.js</text>
  <text class="txt sub" x="630" y="185" text-anchor="middle">JavaScript を動かす</text>
  <text class="txt sub" x="630" y="202" text-anchor="middle">講座では自分のパソコンで使う</text>
</svg>
