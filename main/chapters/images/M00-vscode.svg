<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 512" width="740" height="512" role="img" aria-labelledby="t d">
  <title id="t">npm install が終わった VS Code の画面</title>
  <desc id="d">TSLecture フォルダを開いた VS Code の画面。左のファイルの一覧には、.vscode、basics、html、images、main、node_modules、practice、react、scripts のフォルダと、package.json や README.md などのファイルが並ぶ。node_modules は npm install で増えたフォルダ。下のターミナルには、npm install と打った後に、added 28 packages, and audited 29 packages in 917ms、found 0 vulnerabilities と表示され、その下に npm warn で始まる行が続く。</desc>
  <!-- 寸法：900×560 の窓を 0.8 倍。タイトルバー 35、アイコンの列 48、エクスプローラー 260、ステータスバー 22（VS Code の既定の大きさ）。パネルは、npm install の表示が全部見えるように、既定の 220 より高くしてある（境目を上に引いた状態） -->
  <style>
    .ui { font-family: -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif; font-size: 10.5px; fill: #cccccc; }
    .mono { font-family: Menlo, Consolas, "Courier New", monospace; font-size: 10px; fill: #cccccc; }
    .small { font-size: 9px; }
    .bold { font-weight: 700; }
    .faint { fill: #9d9d9d; }
    .t-bold { font-weight: 700; }
    .t-yellow { fill: #e5e510; }
    .t-blue { fill: #3b8eea; }
    .t-green { fill: #0dbc79; font-weight: 700; }
    .frame { fill: #1f1f1f; stroke: #3c3c3c; stroke-width: 1; }
    .bar { fill: #181818; }
    .edge { fill: none; stroke: #2b2b2b; stroke-width: 1; }
    .blue { fill: #0078d4; }
    .icon { fill: none; stroke: #858585; stroke-width: 1.3; }
    .icon-on { fill: none; stroke: #d7d7d7; stroke-width: 1.3; }
    .red { fill: #ff5f57; }
    .yellow { fill: #febc2e; }
    .green { fill: #28c840; }
    .mark { fill: none; stroke: #ea580c; stroke-width: 2; }
    .badge { fill: #ea580c; }
    .badge-num { font-family: -apple-system, "Segoe UI", sans-serif; font-size: 11px; font-weight: 700; fill: #ffffff; }
    .note { font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; font-size: 13px; fill: #1f2937; }
    .note-sub { fill: #4b5563; }
    .note-acc { fill: #c2410c; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .mark { stroke: #fb923c; }
      .badge { fill: #f97316; }
      .note { fill: #e5e7eb; }
      .note-sub { fill: #9ca3af; }
      .note-acc { fill: #fb923c; }
    }
  </style>

  <!-- 窓とタイトルバー（高さ 28） -->
  <rect class="frame" x="10" y="10" width="720" height="448" rx="9"/>
  <path class="bar" d="M19,10 H721 A9,9 0 0 1 730,19 V38 H10 V19 A9,9 0 0 1 19,10 Z"/>
  <circle class="red" cx="24" cy="24" r="4.8"/><circle class="yellow" cx="40" cy="24" r="4.8"/><circle class="green" cx="56" cy="24" r="4.8"/>
  <text class="ui faint" x="370" y="27.5" text-anchor="middle">TSLecture</text>
  <path class="edge" d="M10,38 H730"/>

  <!-- アイコンの列（幅 38.4） -->
  <rect class="bar" x="10" y="38" width="38.4" height="402.4"/>
  <rect class="blue" x="10" y="38" width="1.6" height="38.4"/>
  <path class="icon-on" d="M23,48 h8 l4.5,4.5 v11.5 h-12.5 z M31,48 v4.5 h4.5"/>
  <circle class="icon" cx="28" cy="93" r="5.5"/><path class="icon" d="M32,97 L36,101"/>
  <circle class="icon" cx="24" cy="126" r="2.2"/><circle class="icon" cx="33" cy="126" r="2.2"/><circle class="icon" cx="24" cy="142" r="2.2"/><path class="icon" d="M24,128.2 V139.8 M33,128.2 C33,135 24,133 24,139.8"/>

