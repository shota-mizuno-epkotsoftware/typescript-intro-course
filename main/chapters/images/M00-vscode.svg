  <text class="ui" x="72" y="430.4">tsconfig.json</text>

  <!-- パネル（見出し 28） -->
  <rect class="bar" x="256.4" y="150" width="473.6" height="290.4"/>
  <path class="edge" d="M256.4,150 H730"/>
  <text class="ui small faint" x="270" y="167.6">問題</text>
  <text class="ui small faint" x="300" y="167.6">出力</text>
  <text class="ui small faint" x="330" y="167.6">デバッグ コンソール</text>
  <text class="ui small" x="428" y="167.6">ターミナル</text>
  <rect class="blue" x="426" y="173.6" width="49" height="1.3"/>
  <text class="mono" x="270" y="200" xml:space="preserve">$ npm install</text>
  <text class="mono" x="270" y="228.8" xml:space="preserve">added 28 packages, and audited 29 packages in 917ms</text>
  <text class="mono" x="270" y="257.6" xml:space="preserve">9 packages are looking for funding</text>
  <text class="mono" x="270" y="272" xml:space="preserve">  run `npm fund` for details</text>
  <text class="mono" x="270" y="300.8" xml:space="preserve">found <tspan class="t-green">0</tspan> vulnerabilities</text>
  <text class="mono" x="270" y="315.2" xml:space="preserve"><tspan class="t-bold">npm</tspan> <tspan class="t-yellow">warn</tspan> <tspan class="t-blue">install-scripts</tspan> 1 package has install scripts not yet covered by </text>
  <text class="mono" x="270" y="329.6" xml:space="preserve">allowScripts:</text>
  <text class="mono" x="270" y="344" xml:space="preserve"><tspan class="t-bold">npm</tspan> <tspan class="t-yellow">warn</tspan> <tspan class="t-blue">install-scripts</tspan>   fsevents@2.3.3 (install: (install scripts prese</text>
  <text class="mono" x="270" y="358.4" xml:space="preserve">nt))</text>
  <text class="mono" x="270" y="372.8" xml:space="preserve"><tspan class="t-bold">npm</tspan> <tspan class="t-yellow">warn</tspan> <tspan class="t-blue">install-scripts</tspan></text>
  <text class="mono" x="270" y="387.2" xml:space="preserve"><tspan class="t-bold">npm</tspan> <tspan class="t-yellow">warn</tspan> <tspan class="t-blue">install-scripts</tspan> Run `npm install-scripts ls` to review, or `npm i</text>
  <text class="mono" x="270" y="401.6" xml:space="preserve">nstall-scripts approve &lt;pkg&gt;` to allow.</text>
  <text class="mono" x="270" y="416" xml:space="preserve">$ </text>

  <!-- ステータスバー（高さ 17.6） -->
  <path class="bar" d="M10,440.4 H730 V449 A9,9 0 0 1 721,458 H19 A9,9 0 0 1 10,449 Z"/>
  <path class="edge" d="M10,440.4 H730"/>
  <text class="ui small faint" x="20" y="452.5">⊗ 0  ⚠ 0</text>
