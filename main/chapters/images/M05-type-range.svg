<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" role="img" aria-labelledby="t d">
  <title id="t">string は Category より広い</title>
  <desc id="d">型を、入る値の範囲として描いた図。いちばん外側の string（let a の型）には、"travel" や "abc" など、どんな文字列も入る。その内側の Category には "food" と "transport" だけが入る。さらに内側の "transport" 型（const b の型）には "transport" だけが入る。外側の string の値は、Category に入らない（型エラー）。内側の "transport" 型の値は、外側の Category にも入る。</desc>
  <style>
    .txt { fill: #1f2937; font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; font-size: 13px; }
    .sub { fill: #4b5563; font-size: 12px; }
    .code { fill: #1f2937; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; }
    .head { font-weight: 700; }
    .outer { fill: #f8fafc; stroke: #64748b; stroke-width: 1.5; }
    .obj { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
    .inner { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.5; }
    .line { fill: none; stroke: #2563eb; stroke-width: 1.8; }
    .tip { fill: #2563eb; }
    .chk { fill: none; stroke: #c2410c; stroke-width: 1.8; }
    .chk-x { fill: none; stroke: #c2410c; stroke-width: 2.4; stroke-linecap: round; }
    .chk-txt { fill: #c2410c; font-weight: 700; }
    .tip-chk { fill: #c2410c; }
    @media (prefers-color-scheme: dark) {
      .txt, .code { fill: #e5e7eb; }
      .sub { fill: #9ca3af; }
      .outer { fill: #1e293b; stroke: #94a3b8; }
      .obj { fill: #172554; stroke: #60a5fa; }
      .inner { fill: #1e3a8a; stroke: #60a5fa; }
      .line { stroke: #60a5fa; }
      .tip { fill: #60a5fa; }
      .chk, .chk-x { stroke: #fb923c; }
      .chk-txt { fill: #fdba74; }
      .tip-chk { fill: #fb923c; }
    }
  </style>
  <defs>
    <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="tip-chk" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <!-- string（let a の型） -->
  <rect class="outer" x="20" y="20" width="600" height="210" rx="10"/>
  <text class="code head" x="36" y="44">string</text>
  <text class="txt sub" x="96" y="44">let a の型</text>
  <text class="code" x="480" y="118">"travel"</text>
  <text class="code" x="480" y="148">"abc"</text>
  <text class="txt sub" x="480" y="178">ほかの文字列</text>

  <!-- Category -->
  <rect class="obj" x="40" y="60" width="330" height="156" rx="10"/>
  <text class="code head" x="56" y="84">Category</text>
  <text class="code" x="56" y="196">"food"</text>

  <!-- "transport" 型（const b の型） -->
  <rect class="inner" x="196" y="128" width="156" height="68" rx="8"/>
  <text class="txt sub" x="208" y="148">const b の型</text>
  <text class="code" x="274" y="180" text-anchor="middle">"transport"</text>


  <!-- 入らない（型エラー） -->
  <path class="chk" d="M470,114 L382,114" marker-end="url(#ac)"/>
  <path class="chk-x" d="M364,106 L378,122 M378,106 L364,122"/>
  <text class="txt chk-txt" x="382" y="96">入らない（型エラー）</text>
</svg>
