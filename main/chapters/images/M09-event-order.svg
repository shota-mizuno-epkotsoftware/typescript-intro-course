<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300" role="img" aria-labelledby="t d">
  <title id="t">上から順の処理が終わってから、予約した処理が動く</title>
  <desc id="d">上から順に実行する処理（最初の行の表示、タイマーの予約、A 開始の表示、A の続きの予約、最後の行の表示）が全部終わった後、予約した処理が時間の早い順に動く。0 ミリ秒のタイマー、100 ミリ秒の A 完了の順。</desc>
  <style>
    .txt { fill: #1f2937; font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; font-size: 13px; }
    .sub { fill: #4b5563; font-size: 12px; }
    .head { font-weight: 700; }
    .box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
    .sync { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
    .later { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
    .num { fill: #2563eb; font-weight: 700; }
    .axis { stroke: #94a3b8; stroke-width: 1.5; }
    .arrow { fill: none; stroke: #64748b; stroke-width: 1.8; }
    .tip { fill: #64748b; }
    @media (prefers-color-scheme: dark) {
      .txt { fill: #e5e7eb; }
      .sub { fill: #9ca3af; }
      .box { fill: #1e293b; stroke: #64748b; }
      .sync { fill: #172554; stroke: #60a5fa; }
      .later { fill: #1e293b; stroke: #64748b; }
      .num { fill: #93c5fd; }
      .axis { stroke: #64748b; }
      .arrow { stroke: #94a3b8; }
      .tip { fill: #94a3b8; }
    }
  </style>
  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="tip" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <!-- 上から順に実行する処理 -->
  <rect class="sync" x="20" y="30" width="280" height="240" rx="8"/>
  <text class="txt head" x="36" y="56">① 上から順に実行する</text>
  <text class="txt" x="36" y="90"><tspan class="num">表示</tspan>　最初の行</text>
  <text class="txt sub" x="36" y="118">予約　「タイマー」を 0 ミリ秒後に</text>
  <text class="txt" x="36" y="146"><tspan class="num">表示</tspan>　A 開始</text>
  <text class="txt sub" x="36" y="174">予約　A の続きを 100 ミリ秒後に</text>
  <text class="txt" x="36" y="202"><tspan class="num">表示</tspan>　最後の行</text>
  <text class="txt sub" x="36" y="248">ここで、上から順の処理が全部終わる</text>

  <path class="arrow" d="M304,244 L346,244" marker-end="url(#m)"/>

  <!-- 予約された処理 -->
  <rect class="later" x="350" y="30" width="330" height="240" rx="8"/>
  <text class="txt head" x="366" y="56">② 予約した処理が、時間の早い順に動く</text>
  <text class="txt sub" x="366" y="76">経過（ミリ秒）</text>
  <line class="axis" x1="390" y1="82" x2="390" y2="250"/>
  <text class="txt sub" x="366" y="104">0</text>
  <text class="txt" x="404" y="104"><tspan class="num">表示</tspan>　タイマー</text>
  <text class="txt sub" x="356" y="216">100</text>
  <text class="txt" x="404" y="216"><tspan class="num">表示</tspan>　A 完了</text>
</svg>
