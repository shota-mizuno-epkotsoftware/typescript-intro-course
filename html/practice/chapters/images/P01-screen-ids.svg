<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 950" width="890" height="950" role="img" aria-labelledby="t d">
  <title id="t">画面の各部分と、HTML の id</title>
  <desc id="d">ブラウザで家計簿のアプリを開いた画面。上から「家計簿」の見出し、「明細を追加する」「集計」「明細」の 3 つの区画が並ぶ。「明細を追加する」の区画には、種別・日付・金額・分類・メモの欄と「追加」のボタンが並ぶフォーム（#entry-form）があり、分類の選択欄は #category。その下に、分類の読み込みの文言を出す #category-status（今は空）と、入力のエラーを並べる #form-errors（「金額は 1 以上の整数で入力してください」）がある。「集計」の区画には、月の選択欄 #filter-month と種別の選択欄 #filter-kind、収入・支出・収支の金額 #total-income・#total-expense・#balance、「分類ごとの支出」のリスト #category-totals がある。「明細」の区画には、明細の一覧 #entry-list（日付、分類や入金元とメモ、金額、「削除」のボタンが 1 行ずつ並ぶ）と、明細が 1 件もないときの文 #empty-message（今は表示されていない）がある。</desc>
  <!-- 寸法：幅 900 の窓を 0.8 倍。タブの列 40、ツールバー 45。ページ全体が入るように、窓の縦だけを伸ばした（実物では下はスクロールして見る）。
       ページは practice/app/style.css の値から：本文の幅 44rem、区画の内側の余白 1rem 1.25rem、ラベル 0.85rem、文字 16px（0.8 倍で 12.8） -->
  <style>
    .ui { font-family: -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif; font-size: 10.5px; fill: #1f1f1f; }
    .gray { fill: #5f6368; }
    .frame { fill: #ffffff; stroke: #c4c7c5; stroke-width: 1; }
    .strip { fill: #dfe3e8; }
    .white { fill: #ffffff; }
    .omni { fill: #eef1f4; }
    .edge { fill: none; stroke: #dadce0; stroke-width: 1; }
    .icon { fill: none; stroke: #5f6368; stroke-width: 1.3; }
    .red { fill: #ff5f57; }
    .yellow { fill: #febc2e; }
    .green { fill: #28c840; }
    .pg { font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif; font-size: 12.8px; fill: #1f2328; }
    .h1 { font-size: 20.5px; font-weight: 700; }
    .h2 { font-size: 14px; font-weight: 700; }
    .h3 { font-size: 12.2px; font-weight: 700; fill: #59636e; }
    .lbl { font-size: 10.9px; fill: #59636e; }
    .ctl { font-size: 10.9px; }
    .small { font-size: 11.5px; }
    .muted { fill: #59636e; }
    .inc { fill: #1a7f37; }
    .exp { fill: #b42318; }
    .panel { fill: #ffffff; stroke: #d8dee4; stroke-width: 0.8; }
    .ctrl { fill: #ffffff; stroke: #d8dee4; stroke-width: 0.8; }
    .btn { fill: #f6f7f9; stroke: #d8dee4; stroke-width: 0.8; }
    .rule { fill: none; stroke: #d8dee4; stroke-width: 0.8; }
    .chev { fill: none; stroke: #1f2328; stroke-width: 1; }
    .mark { fill: none; stroke: #ea580c; stroke-width: 1.5; }
    .mark-empty { fill: none; stroke: #ea580c; stroke-width: 1.5; stroke-dasharray: 4 3; }
    .lead { fill: none; stroke: #ea580c; stroke-width: 1; }
    .tag { fill: none; stroke: #ea580c; stroke-width: 1.2; }
    .tag-txt { font-family: Menlo, Consolas, "Courier New", monospace; font-size: 11px; font-weight: 700; fill: #c2410c; }
    .note { font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; font-size: 13px; fill: #1f2937; }
    @media (prefers-color-scheme: dark) {
      .mark, .mark-empty, .lead, .tag { stroke: #fb923c; }
      .tag-txt { fill: #fb923c; }
      .note { fill: #e5e7eb; }
    }
  </style>

  <!-- 窓とタブの列（高さ 32） -->
  <rect class="frame" x="10" y="10" width="720" height="876" rx="9"/>
  <path class="strip" d="M19,10 H721 A9,9 0 0 1 730,19 V42 H10 V19 A9,9 0 0 1 19,10 Z"/>
  <circle class="red" cx="24" cy="26" r="4.8"/><circle class="yellow" cx="40" cy="26" r="4.8"/><circle class="green" cx="56" cy="26" r="4.8"/>
  <path class="white" d="M76,42 V22 A5,5 0 0 1 81,17 H231 A5,5 0 0 1 236,22 V42 Z"/>
  <text class="ui" x="88" y="33">家計簿</text>
  <text class="ui gray" x="223" y="33" text-anchor="middle">×</text>
  <text class="ui gray" x="250" y="33">+</text>

  <!-- ツールバー（高さ 36） -->
  <rect class="white" x="10.5" y="42" width="719" height="36"/>
  <path class="icon" d="M32,60 H22 M26.5,55.5 L22,60 L26.5,64.5"/>
  <path class="icon" d="M42,60 H52 M47.5,55.5 L52,60 L47.5,64.5"/>
  <path class="icon" d="M74,56 A5,5 0 1 0 75,62 M74,52 V56 H70"/>
  <rect class="omni" x="92" y="46.5" width="620" height="27" rx="13.5"/>
  <circle class="icon" cx="106" cy="60" r="5"/><path class="icon" d="M106,58 V58.3 M106,60 V62.8"/>
  <text class="ui" x="118" y="64">localhost:5173</text>
  <path class="edge" d="M10.5,78 H729.5"/>

  <!-- ページ -->
  <text class="pg h1" x="101" y="129">家計簿</text>

  <!-- 区画 1：明細を追加する -->
  <rect class="panel" x="101.5" y="152" width="537" height="200" rx="6"/>
  <text class="pg h2" x="118" y="182">明細を追加する</text>
  <text class="pg lbl" x="118" y="211">種別</text>
  <rect class="ctrl" x="118" y="216" width="48" height="28" rx="4.8"/>
  <text class="pg ctl" x="124" y="234">支出</text>
  <path class="chev" d="M151,228 L154.5,231.5 L158,228"/>
  <text class="pg lbl" x="179" y="211">日付</text>
  <rect class="ctrl" x="179" y="216" width="112" height="28" rx="4.8"/>
  <text class="pg ctl" x="185" y="234">2026/11/18</text>
  <rect class="chev" x="272" y="225" width="10" height="10" rx="1"/><path class="chev" d="M272,228.5 H282"/>
  <text class="pg lbl" x="304" y="211">金額</text>
  <rect class="ctrl" x="304" y="216" width="136" height="28" rx="4.8"/>
  <text class="pg lbl" x="453" y="211">分類</text>
  <rect class="ctrl" x="453" y="216" width="64" height="28" rx="4.8"/>
  <text class="pg ctl" x="459" y="234">食費</text>
  <path class="chev" d="M502,228 L505.5,231.5 L509,228"/>
  <text class="pg lbl" x="118" y="263">メモ</text>
  <rect class="ctrl" x="118" y="268" width="136" height="28" rx="4.8"/>
  <rect class="btn" x="267" y="265" width="36" height="31" rx="4.8"/>
  <text class="pg" x="285" y="285" text-anchor="middle">追加</text>
  <text class="pg small exp" x="126" y="332">•</text>
  <text class="pg small exp" x="138" y="332">金額は 1 以上の整数で入力してください</text>

  <!-- 区画 2：集計 -->
  <rect class="panel" x="101.5" y="368" width="537" height="269" rx="6"/>
  <text class="pg h2" x="118" y="398">集計</text>
  <text class="pg lbl" x="118" y="427">月</text>
  <rect class="ctrl" x="118" y="432" width="76" height="28" rx="4.8"/>
  <text class="pg ctl" x="124" y="450">すべて</text>
  <path class="chev" d="M179,444 L182.5,447.5 L186,444"/>
  <text class="pg lbl" x="207" y="427">種別</text>
  <rect class="ctrl" x="207" y="432" width="76" height="28" rx="4.8"/>
  <text class="pg ctl" x="213" y="450">すべて</text>
  <path class="chev" d="M268,444 L271.5,447.5 L275,444"/>
  <text class="pg muted" x="118" y="489">収入</text>
  <text class="pg" x="182" y="489">200,000円</text>
  <text class="pg muted" x="118" y="514">支出</text>
  <text class="pg" x="182" y="514">2,000円</text>
  <text class="pg muted" x="118" y="539">収支</text>
  <text class="pg inc" x="182" y="539">198,000円</text>
  <text class="pg h3" x="118" y="572">分類ごとの支出</text>
  <text class="pg" x="118" y="595">交通費: 1,200円</text>
  <text class="pg" x="118" y="617">食費: 800円</text>

  <!-- 区画 3：明細 -->
  <rect class="panel" x="101.5" y="653" width="537" height="207" rx="6"/>
  <text class="pg h2" x="118" y="683">明細</text>
  <text class="pg" x="118" y="720">2026-11-15</text>
  <text class="pg" x="211" y="720">食費<tspan class="ctl muted"> 昼食</tspan></text>
  <text class="pg exp" x="576" y="720" text-anchor="end">-800円</text>
  <rect class="btn" x="586" y="700" width="36" height="31" rx="4.8"/>
  <text class="pg" x="604" y="720" text-anchor="middle">削除</text>
  <path class="rule" d="M118,737.6 H622"/>
  <text class="pg" x="118" y="764.6">2026-11-01</text>
  <text class="pg" x="211" y="764.6">給料</text>
  <text class="pg inc" x="576" y="764.6" text-anchor="end">+200,000円</text>
  <rect class="btn" x="586" y="744.6" width="36" height="31" rx="4.8"/>
  <text class="pg" x="604" y="764.6" text-anchor="middle">削除</text>
  <path class="rule" d="M118,782.2 H622"/>
  <text class="pg" x="118" y="809.2">2026-10-28</text>
  <text class="pg" x="211" y="809.2">交通費</text>
  <text class="pg exp" x="576" y="809.2" text-anchor="end">-1,200円</text>
  <rect class="btn" x="586" y="789.2" width="36" height="31" rx="4.8"/>
  <text class="pg" x="604" y="809.2" text-anchor="middle">削除</text>
  <path class="rule" d="M118,826.8 H622"/>

  <!-- id の付いた要素の囲み（破線は、今は何も表示されていない要素） -->
  <rect class="mark" x="114" y="198" width="512" height="102" rx="3"/>
  <rect class="mark" x="450" y="213" width="70" height="34" rx="3"/>
  <rect class="mark-empty" x="116" y="304" width="508" height="10" rx="2"/>
  <rect class="mark" x="114" y="319" width="512" height="19" rx="3"/>
  <rect class="mark" x="115" y="429" width="82" height="34" rx="3"/>
  <rect class="mark" x="204" y="429" width="82" height="34" rx="3"/>
  <rect class="mark" x="179" y="476" width="76" height="18" rx="3"/>
  <rect class="mark" x="179" y="501" width="76" height="18" rx="3"/>
  <rect class="mark" x="179" y="526" width="76" height="18" rx="3"/>
  <rect class="mark" x="114" y="580" width="512" height="43" rx="3"/>
  <rect class="mark" x="114" y="691" width="512" height="138" rx="3"/>
  <rect class="mark-empty" x="116" y="834" width="508" height="12" rx="2"/>

  <!-- 札への線 -->
  <path class="lead" d="M626,206 H748"/>
  <path class="lead" d="M520,230 H748"/>
  <path class="lead" d="M624,309 H748"/>
  <path class="lead" d="M626,328 L748,333"/>
  <path class="lead" d="M286,446 H748"/>
  <path class="lead" d="M156,463 V467 H748"/>
  <path class="lead" d="M255,485 L748,491"/>
  <path class="lead" d="M255,510 L748,515"/>
  <path class="lead" d="M255,535 L748,539"/>
  <path class="lead" d="M626,601 H748"/>
  <path class="lead" d="M626,760 H748"/>
  <path class="lead" d="M624,840 H748"/>

  <!-- id の札 -->
  <g>
    <rect class="tag" x="748" y="197" width="130" height="18" rx="4"/><text class="tag-txt" x="756" y="210">#entry-form</text>
    <rect class="tag" x="748" y="221" width="130" height="18" rx="4"/><text class="tag-txt" x="756" y="234">#category</text>
    <rect class="tag" x="748" y="300" width="130" height="18" rx="4"/><text class="tag-txt" x="756" y="313">#category-status</text>
    <rect class="tag" x="748" y="324" width="130" height="18" rx="4"/><text class="tag-txt" x="756" y="337">#form-errors</text>
    <rect class="tag" x="748" y="437" width="130" height="18" rx="4"/><text class="tag-txt" x="756" y="450">#filter-kind</text>
    <rect class="tag" x="748" y="458" width="130" height="18" rx="4"/><text class="tag-txt" x="756" y="471">#filter-month</text>
    <rect class="tag" x="748" y="482" width="130" height="18" rx="4"/><text class="tag-txt" x="756" y="495">#total-income</text>
    <rect class="tag" x="748" y="506" width="130" height="18" rx="4"/><text class="tag-txt" x="756" y="519">#total-expense</text>
    <rect class="tag" x="748" y="530" width="130" height="18" rx="4"/><text class="tag-txt" x="756" y="543">#balance</text>
    <rect class="tag" x="748" y="592" width="130" height="18" rx="4"/><text class="tag-txt" x="756" y="605">#category-totals</text>
    <rect class="tag" x="748" y="751" width="130" height="18" rx="4"/><text class="tag-txt" x="756" y="764">#entry-list</text>
    <rect class="tag" x="748" y="831" width="130" height="18" rx="4"/><text class="tag-txt" x="756" y="844">#empty-message</text>
  </g>

  <!-- 下の説明 -->
  <text class="note" x="10" y="914">オレンジの枠と札は、index.html で id を付けた要素。</text>
  <text class="note" x="10" y="938">破線の枠は、今は何も表示されていない要素。</text>
</svg>
