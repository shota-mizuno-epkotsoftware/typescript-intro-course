<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 292" width="740" height="292" role="img" aria-labelledby="t d">
  <title id="t">登録してから待つか、待ってから登録するか</title>
  <desc id="d">時間を横に取った図。上の帯は今のコードで、イベントを登録し、render の後で分類の読み込みを待つ。待っている間に種別を収入に切り替えると、登録済みの処理が動き、フォームが切り替わる。読み込みが終わると update と render が動く。下の帯は 2 行を前に書いた場合で、render の後すぐに読み込みを待ち、終わってから update と render、その後でイベントを登録する。待っている間に種別を切り替えても、処理がまだないので、フォームは変わらない。さらに「追加」を押すと、ページが読み込み直される。読み込みが終わると、render で選択欄が支出に戻る。</desc>
  <style>
    .txt { fill: #1f2937; font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; font-size: 13px; }
    .sub { fill: #4b5563; font-size: 11.5px; }
    .head { font-weight: 700; }
    .code { fill: #1f2937; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
    .var { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
    .obj { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
    .wait { fill: none; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 5 3; }
    .line2 { fill: none; stroke: #64748b; stroke-width: 1.5; }
    .ev { fill: none; stroke: #b45309; stroke-width: 1.8; }
    .ev-txt { fill: #b45309; }
    .tip2 { fill: #64748b; }
    .tip3 { fill: #b45309; }
    @media (prefers-color-scheme: dark) {
      .txt, .code { fill: #e5e7eb; }
      .sub { fill: #9ca3af; }
      .var { fill: #1e293b; stroke: #64748b; }
      .obj { fill: #172554; stroke: #60a5fa; }
      .wait { stroke: #64748b; }
      .line2 { stroke: #94a3b8; }
      .ev { stroke: #fbbf24; }
      .ev-txt { fill: #fbbf24; }
      .tip2 { fill: #94a3b8; }
      .tip3 { fill: #fbbf24; }
    }
  </style>
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="tip2" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="tip3" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <!-- 時間の軸 -->
  <path class="line2" d="M170,20 L724,20" marker-end="url(#a2)"/>
  <text class="txt sub" x="170" y="14">時間</text>

  <!-- 上の帯：今のコード -->
  <text class="txt head" x="20" y="64">今のコード</text>
  <text class="txt sub" x="20" y="82">登録してから待つ</text>
  <rect class="obj" x="170" y="48" width="118" height="40" rx="6"/>
  <text class="txt" x="229" y="73" text-anchor="middle">イベントを登録</text>
  <rect class="var" x="292" y="48" width="64" height="40" rx="6"/>
  <text class="code" x="324" y="73" text-anchor="middle">render</text>
  <rect class="wait" x="360" y="48" width="240" height="40" rx="6"/>
  <text class="txt sub" x="480" y="73" text-anchor="middle">await：分類の読み込みを待つ</text>
  <rect class="var" x="604" y="48" width="120" height="40" rx="6"/>
  <text class="code" x="664" y="73" text-anchor="middle">update→render</text>
  <path class="line2" d="M440,118 L440,92" marker-end="url(#a2)"/>
  <text class="txt" x="440" y="136" text-anchor="middle">種別を「収入」に → 登録した処理（update→render）が動き、フォームが切り替わる</text>

  <!-- 下の帯：2 行を前に書いた場合 -->
  <text class="txt head" x="20" y="184">2 行を前に</text>
  <text class="txt head" x="20" y="200">書いた場合</text>
  <text class="txt sub" x="20" y="218">待ってから登録</text>
  <rect class="var" x="170" y="176" width="64" height="40" rx="6"/>
  <text class="code" x="202" y="201" text-anchor="middle">render</text>
  <rect class="wait" x="238" y="176" width="240" height="40" rx="6"/>
  <text class="txt sub" x="358" y="201" text-anchor="middle">await：分類の読み込みを待つ</text>
  <rect class="var" x="482" y="176" width="120" height="40" rx="6"/>
  <text class="code" x="542" y="201" text-anchor="middle">update→render</text>
  <text class="txt sub" x="542" y="232" text-anchor="middle">選択欄が「支出」に戻る</text>
  <rect class="obj" x="606" y="176" width="118" height="40" rx="6"/>
  <text class="txt" x="665" y="201" text-anchor="middle">イベントを登録</text>
  <path class="ev" d="M360,246 L360,220" marker-end="url(#a3)"/>
  <text class="txt ev-txt" x="190" y="264">種別を「収入」に → 処理がまだなく、フォームは変わらない</text>
  <text class="txt ev-txt" x="190" y="282">さらに「追加」を押すと、ページが読み込み直される</text>
</svg>
