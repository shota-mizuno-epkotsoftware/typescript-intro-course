<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" role="img" aria-labelledby="t d">
  <title id="t">state は、その回の値のまま</title>
  <desc id="d">左は前の回に呼ばれた App で、state.entries は明細 2 件。その回に作った handleAdd は、この state を覚えている。handleAdd の中で setState を呼ぶと、次はこの値で呼んでほしいと React に頼む。その後の console.log(state.entries.length) は、覚えている左の state を読むので 2 を出す。右は次に呼ばれた App で、state.entries は明細 3 件。handleAdd も新しく作られ、右の state を覚えている。EntryForm の onAdd は、右の新しい handleAdd を指している。次に「追加」を押すと動くのは、こちら。</desc>
  <style>
    .txt { fill: #1f2937; font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; font-size: 13px; }
    .sub { fill: #4b5563; font-size: 11.5px; }
    .head { font-weight: 700; }
    .code { fill: #1f2937; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; }
    .small { font-size: 11.5px; }
    .var { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
    .obj { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
    .area { fill: none; stroke: #cbd5e1; stroke-width: 1.2; }
    .line { fill: none; stroke: #2563eb; stroke-width: 1.8; }
    .line2 { fill: none; stroke: #64748b; stroke-width: 1.8; }
    .tip { fill: #2563eb; }
    .tip2 { fill: #64748b; }
    @media (prefers-color-scheme: dark) {
      .txt, .code { fill: #e5e7eb; }
      .sub { fill: #9ca3af; }
      .var { fill: #1e293b; stroke: #64748b; }
      .obj { fill: #172554; stroke: #60a5fa; }
      .area { stroke: #475569; }
      .line { stroke: #60a5fa; }
      .line2 { stroke: #94a3b8; }
      .tip { fill: #60a5fa; }
      .tip2 { fill: #94a3b8; }
    }
  </style>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="tip" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="tip2" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <!-- 前の回 -->
  <rect class="area" x="10" y="34" width="345" height="210" rx="10"/>
  <text class="txt head" x="22" y="24">前の回に呼ばれた App</text>
  <rect class="obj" x="22" y="48" width="321" height="40" rx="8"/>
  <text class="code" x="182" y="73" text-anchor="middle">state.entries：明細 2 件</text>
  <rect class="obj" x="22" y="124" width="321" height="108" rx="8"/>
  <text class="code head" x="34" y="146">handleAdd</text>
  <text class="txt sub" x="114" y="146">この回に作った</text>
  <text class="code small" x="34" y="176">setState((prev) =&gt; addEntry(prev, entry));</text>
  <text class="code small" x="34" y="202">console.log(state.entries.length);</text>
  <text class="code small" x="34" y="220">// → 2</text>
  <path class="line" d="M120,124 L120,92" marker-end="url(#a1)"/>
  <text class="txt sub" x="130" y="112">覚えている</text>

  <!-- 次の回 -->
  <rect class="area" x="445" y="34" width="345" height="210" rx="10"/>
  <text class="txt head" x="457" y="24">次に呼ばれた App</text>
  <rect class="var" x="457" y="48" width="321" height="40" rx="8"/>
  <text class="code" x="617" y="73" text-anchor="middle">state.entries：明細 3 件</text>
  <rect class="var" x="457" y="124" width="321" height="108" rx="8"/>
  <text class="code head" x="469" y="146">handleAdd</text>
  <text class="txt sub" x="549" y="146">新しく作った</text>
  <text class="code small" x="469" y="176">setState((prev) =&gt; addEntry(prev, entry));</text>
  <text class="code small" x="469" y="202">console.log(state.entries.length);</text>
  <path class="line2" d="M555,124 L555,92" marker-end="url(#a2)"/>
  <text class="txt sub" x="565" y="112">覚えている</text>

  <!-- setState -->
  <path class="line2" d="M343,172 C396,172 398,68 453,68" marker-end="url(#a2)"/>
  <text class="code small" x="400" y="200" text-anchor="middle">setState で</text>
  <text class="txt sub" x="400" y="218" text-anchor="middle">「次はこの値で」</text>
  <text class="txt sub" x="400" y="234" text-anchor="middle">と頼む</text>

  <!-- EntryForm -->
  <rect class="var" x="457" y="276" width="140" height="40" rx="8"/>
  <text class="code head" x="527" y="301" text-anchor="middle">EntryForm</text>
  <path class="line2" d="M527,276 L527,248" marker-end="url(#a2)"/>
  <text class="code small" x="537" y="266">onAdd</text>
  <text class="txt sub" x="615" y="294">次に「追加」を押すと、</text>
  <text class="txt sub" x="615" y="310">右の handleAdd が動く</text>
</svg>
