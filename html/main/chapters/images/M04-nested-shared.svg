<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 228" width="660" height="228" role="img" aria-labelledby="t d">
  <title id="t">コピーされるのは 1 段目だけ</title>
  <desc id="d">user と moved は、別々のオブジェクトを指している。どちらの address も、同じ 1 つの { city: "大阪" } を指している。</desc>
  <style>
    .txt { fill: #1f2937; font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; font-size: 13px; }
    .sub { fill: #4b5563; font-size: 12px; }
    .code { fill: #1f2937; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; }
    .var { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
    .obj { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
    .obj2 { fill: #f8fafc; stroke: #64748b; stroke-width: 1.5; }
    .line { fill: none; stroke: #2563eb; stroke-width: 1.8; }
    .line2 { fill: none; stroke: #64748b; stroke-width: 1.8; }
    .dot { fill: #2563eb; }
    .head { fill: #2563eb; }
    .head2 { fill: #64748b; }
    @media (prefers-color-scheme: dark) {
      .txt, .code { fill: #e5e7eb; }
      .sub { fill: #9ca3af; }
      .var { fill: #1e293b; stroke: #64748b; }
      .obj { fill: #172554; stroke: #60a5fa; }
      .obj2 { fill: #1e293b; stroke: #94a3b8; }
      .line { stroke: #60a5fa; }
      .line2 { stroke: #94a3b8; }
      .dot { fill: #60a5fa; }
      .head { fill: #60a5fa; }
      .head2 { fill: #94a3b8; }
    }
  </style>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="head2" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <text class="txt sub" x="20" y="22">変数</text>
  <text class="txt sub" x="170" y="22">1 段目のオブジェクト</text>
  <text class="txt sub" x="470" y="22">中のオブジェクト</text>

  <rect class="var" x="20" y="44" width="100" height="36" rx="6"/>
  <text class="code" x="70" y="67" text-anchor="middle">user</text>
  <rect class="var" x="20" y="170" width="100" height="36" rx="6"/>
  <text class="code" x="70" y="193" text-anchor="middle">moved</text>

  <rect class="obj2" x="170" y="34" width="230" height="56" rx="8"/>
  <text class="code" x="186" y="57">{ name: "Alice",</text>
  <text class="code" x="186" y="78">  address: </text>
  <circle class="dot" cx="282" cy="74" r="4"/>

  <rect class="obj2" x="170" y="160" width="230" height="56" rx="8"/>
  <text class="code" x="186" y="183">{ name: "Alice",</text>
  <text class="code" x="186" y="204">  address: </text>
  <circle class="dot" cx="282" cy="200" r="4"/>

  <rect class="obj" x="470" y="100" width="170" height="50" rx="8"/>
  <text class="code" x="555" y="130" text-anchor="middle">{ city: "大阪" }</text>

  <path class="line2" d="M120,62 L166,62" marker-end="url(#a2)"/>
  <path class="line2" d="M120,188 L166,188" marker-end="url(#a2)"/>
  <path class="line" d="M286,74 H406 C440,74 432,118 466,118" marker-end="url(#a1)"/>
  <path class="line" d="M286,200 H406 C440,200 432,132 466,132" marker-end="url(#a1)"/>

  <text class="txt sub" x="300" y="136">同じ 1 つを指す</text>
</svg>
