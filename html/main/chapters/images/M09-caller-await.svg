<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 290" width="700" height="290" role="img" aria-labelledby="t d">
  <title id="t">await を付けた呼び出しは待ち、付けない呼び出しは先へ進む</title>
  <desc id="d">左は await step("A")。A 開始を表示し、A が 50 ミリ秒の待ちに入ると、呼び出した側も次の行へ進まずに待つ。50 ミリ秒後に A 完了を表示してから、次の行へ進む。右は await のない step("B")。B 開始を表示し、B が 50 ミリ秒の待ちに入ると、呼び出した側は待たずに次の行へ進み、終わりを表示する。50 ミリ秒後に B 完了を表示する。</desc>
  <style>
    .txt { fill: #1f2937; font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; font-size: 13px; }
    .sub { fill: #4b5563; font-size: 12px; }
    .code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; }
    .head { font-weight: 700; }
    .box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
    .key { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
    .num { fill: #2563eb; font-weight: 700; }
    .axis { stroke: #94a3b8; stroke-width: 1.5; }
    .arrow { fill: none; stroke: #64748b; stroke-width: 1.8; }
    .tip { fill: #64748b; }
    @media (prefers-color-scheme: dark) {
      .txt { fill: #e5e7eb; }
      .sub { fill: #9ca3af; }
      .box { fill: #1e293b; stroke: #64748b; }
      .key { fill: #172554; stroke: #60a5fa; }
      .num { fill: #93c5fd; }
      .axis { stroke: #64748b; }
      .arrow { stroke: #94a3b8; }
      .tip { fill: #94a3b8; }
    }
  </style>
  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="tip" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <!-- await step("A") -->
  <rect class="box" x="10" y="10" width="318" height="270" rx="8"/>
  <text class="txt head" x="26" y="36">① <tspan class="code">await step("A");</tspan></text>
  <text class="txt sub" x="26" y="62">経過（ミリ秒）</text>
  <line class="axis" x1="50" y1="70" x2="50" y2="262"/>
  <text class="txt sub" x="26" y="92">0</text>
  <text class="txt" x="64" y="92"><tspan class="num">表示</tspan>　A 開始</text>
  <rect class="key" x="62" y="106" width="252" height="52" rx="6"/>
  <text class="txt" x="74" y="127">A が 50 ミリ秒の待ちに入る</text>
  <text class="txt head" x="74" y="147">呼び出した側も、ここで待つ</text>
  <text class="txt sub" x="22" y="190">50</text>
  <text class="txt" x="64" y="190"><tspan class="num">表示</tspan>　A 完了</text>
  <text class="txt sub" x="64" y="250">A が終わってから、次の行へ進む</text>

  <path class="arrow" d="M332,250 L366,250" marker-end="url(#m)"/>

  <!-- step("B") -->
  <rect class="box" x="372" y="10" width="318" height="270" rx="8"/>
  <text class="txt head" x="388" y="36">② <tspan class="code">step("B");</tspan><tspan class="sub" style="font-weight:400">　await なし</tspan></text>
  <text class="txt sub" x="388" y="62">経過（ミリ秒）</text>
  <line class="axis" x1="412" y1="70" x2="412" y2="262"/>
  <text class="txt sub" x="384" y="92">50</text>
  <text class="txt" x="426" y="92"><tspan class="num">表示</tspan>　B 開始</text>
  <rect class="key" x="424" y="106" width="252" height="52" rx="6"/>
  <text class="txt" x="436" y="127">B が 50 ミリ秒の待ちに入る</text>
  <text class="txt head" x="436" y="147">呼び出した側は、次の行へ進む</text>
  <text class="txt" x="426" y="190"><tspan class="num">表示</tspan>　終わり</text>
  <text class="txt sub" x="378" y="250">100</text>
  <text class="txt" x="426" y="250"><tspan class="num">表示</tspan>　B 完了</text>
</svg>
