<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" role="img" aria-labelledby="t d">
  <title id="t">確かめると、その先で型が絞り込まれる</title>
  <desc id="d">関数に入ったところで item.memo の型は string | undefined。if (item.memo === undefined) で確かめると、true の側では undefined になり 0 を返す。false の側では string に絞り込まれ、item.memo.length を使える。</desc>
  <style>
    .txt { fill: #1f2937; font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; font-size: 13px; }
    .sub { fill: #4b5563; font-size: 12px; }
    .head { font-weight: 700; }
    .code { fill: #1f2937; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; }
    .var { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
    .obj { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
    .obj2 { fill: #f8fafc; stroke: #64748b; stroke-width: 1.5; }
    .line { fill: none; stroke: #2563eb; stroke-width: 1.8; }
    .line2 { fill: none; stroke: #64748b; stroke-width: 1.8; }
    .tip { fill: #2563eb; }
    .tip2 { fill: #64748b; }
    @media (prefers-color-scheme: dark) {
      .txt, .code { fill: #e5e7eb; }
      .sub { fill: #9ca3af; }
      .var { fill: #1e293b; stroke: #64748b; }
      .obj { fill: #172554; stroke: #60a5fa; }
      .obj2 { fill: #1e293b; stroke: #94a3b8; }
      .line { stroke: #60a5fa; }
      .line2 { stroke: #94a3b8; }
      .tip { fill: #60a5fa; }
      .tip2 { fill: #94a3b8; }
    }
  </style>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="tip" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="tip2" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="var" x="170" y="16" width="300" height="40" rx="8"/>
  <text class="code" x="320" y="41" text-anchor="middle">item.memo : string | undefined</text>
  <path class="line2" d="M320,56 L320,82" marker-end="url(#a2)"/>
  <rect class="obj2" x="150" y="86" width="340" height="40" rx="8"/>
  <text class="code" x="320" y="111" text-anchor="middle">if (item.memo === undefined)</text>
  <path class="line2" d="M240,126 C240,150 160,150 160,172" marker-end="url(#a2)"/>
  <path class="line" d="M400,126 C400,150 480,150 480,172" marker-end="url(#a1)"/>
  <text class="code" x="182" y="146" text-anchor="end">true</text>
  <text class="code" x="458" y="146">false</text>
  <rect class="var" x="40" y="176" width="240" height="56" rx="8"/>
  <text class="code" x="160" y="199" text-anchor="middle">item.memo : undefined</text>
  <text class="code" x="160" y="221" text-anchor="middle">return 0;</text>
  <rect class="obj" x="360" y="176" width="240" height="56" rx="8"/>
  <text class="code" x="480" y="199" text-anchor="middle">item.memo : string</text>
  <text class="code" x="480" y="221" text-anchor="middle">item.memo.length が使える</text>
</svg>
