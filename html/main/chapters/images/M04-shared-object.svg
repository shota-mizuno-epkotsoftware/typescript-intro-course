<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" role="img" aria-labelledby="t d">
  <title id="t">代入は共有、スプレッド構文は新しく作る</title>
  <desc id="d">original と alias の 2 つの変数が、同じ 1 つのオブジェクト { name: "ノート", price: 150 } を指している。copy はスプレッド構文で作られた別のオブジェクト { name: "ノート", price: 200 } を指している。</desc>
  <style>
    .txt { fill: #1f2937; font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; font-size: 13px; }
    .sub { fill: #4b5563; font-size: 12px; }
    .code { fill: #1f2937; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; }
    .var { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
    .obj { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
    .obj2 { fill: #f8fafc; stroke: #64748b; stroke-width: 1.5; }
    .line { fill: none; stroke: #2563eb; stroke-width: 1.8; }
    .line2 { fill: none; stroke: #64748b; stroke-width: 1.8; }
    .head { fill: #2563eb; }
    .head2 { fill: #64748b; }
    @media (prefers-color-scheme: dark) {
      .txt, .code { fill: #e5e7eb; }
      .sub { fill: #9ca3af; }
      .var { fill: #1e293b; stroke: #64748b; }
      .obj { fill: #172554; stroke: #60a5fa; }
      .obj2 { fill: #1e293b; stroke: #94a3b8; }
      .line { stroke: #60a5fa; }
      .line2 { stroke: #94a3b8; }
      .head { fill: #60a5fa; }
      .head2 { fill: #94a3b8; }
    }
  </style>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="head2" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <text class="txt sub" x="30" y="24">変数</text>
  <text class="txt sub" x="340" y="24">オブジェクト（実際の値）</text>

  <rect class="var" x="30" y="40" width="120" height="36" rx="6"/>
  <text class="code" x="90" y="63" text-anchor="middle">original</text>
  <rect class="var" x="30" y="100" width="120" height="36" rx="6"/>
  <text class="code" x="90" y="123" text-anchor="middle">alias</text>
  <rect class="var" x="30" y="190" width="120" height="36" rx="6"/>
  <text class="code" x="90" y="213" text-anchor="middle">copy</text>

  <rect class="obj" x="340" y="52" width="270" height="72" rx="8"/>
  <text class="code" x="358" y="82">{ name: "ノート",</text>
  <text class="code" x="358" y="104">  price: 150 }</text>

  <rect class="obj2" x="340" y="172" width="270" height="72" rx="8"/>
  <text class="code" x="358" y="202">{ name: "ノート",</text>
  <text class="code" x="358" y="224">  price: 200 }</text>

  <path class="line" d="M150,58 C240,58 250,80 336,84" marker-end="url(#a1)"/>
  <path class="line" d="M150,118 C240,118 250,96 336,94" marker-end="url(#a1)"/>
  <path class="line2" d="M150,208 L336,208" marker-end="url(#a2)"/>

  <text class="txt sub" x="182" y="148">同じ 1 つを指す</text>
  <text class="txt sub" x="166" y="194">スプレッド構文で新しく作った</text>
</svg>
