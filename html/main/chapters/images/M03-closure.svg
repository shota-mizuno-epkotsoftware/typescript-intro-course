<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 230" width="660" height="230" role="img" aria-labelledby="t d">
  <title id="t">関数ごとに別の count を覚えている</title>
  <desc id="d">counterA と counterB は、どちらも makeCounter が返したアロー関数を指している。counterA の関数は count が 3 の入れ物を覚え、counterB の関数は count が 1 の別の入れ物を覚えている。</desc>
  <style>
    .txt { fill: #1f2937; font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; font-size: 13px; }
    .sub { fill: #4b5563; font-size: 12px; }
    .head { font-weight: 700; }
    .code { fill: #1f2937; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; }
    .var { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
    .obj { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
    .obj2 { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
    .line { fill: none; stroke: #2563eb; stroke-width: 1.8; }
    .line2 { fill: none; stroke: #64748b; stroke-width: 1.8; }
    .tip { fill: #2563eb; }
    .tip2 { fill: #64748b; }
    @media (prefers-color-scheme: dark) {
      .txt, .code { fill: #e5e7eb; }
      .sub { fill: #9ca3af; }
      .var { fill: #1e293b; stroke: #64748b; }
      .obj { fill: #172554; stroke: #60a5fa; }
      .obj2 { fill: #1e293b; stroke: #64748b; }
      .line { stroke: #60a5fa; }
      .line2 { stroke: #94a3b8; }
      .tip { fill: #60a5fa; }
      .tip2 { fill: #94a3b8; }
    }
  </style>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="tip" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="tip2" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <text class="txt sub" x="20" y="24">変数</text>
  <text class="txt sub" x="186" y="24">makeCounter が返した関数</text>
  <text class="txt sub" x="510" y="24">関数が覚えている変数</text>
  <rect class="var" x="20" y="50" width="120" height="36" rx="6"/>
  <text class="code" x="80" y="73" text-anchor="middle">counterA</text>
  <rect class="var" x="20" y="150" width="120" height="36" rx="6"/>
  <text class="code" x="80" y="173" text-anchor="middle">counterB</text>
  <rect class="obj2" x="186" y="44" width="256" height="48" rx="8"/>
  <text class="code" x="200" y="73">() =&gt; { count = count + 1; … }</text>
  <rect class="obj2" x="186" y="144" width="256" height="48" rx="8"/>
  <text class="code" x="200" y="173">() =&gt; { count = count + 1; … }</text>
  <rect class="obj" x="510" y="48" width="130" height="40" rx="8"/>
  <text class="code" x="575" y="73" text-anchor="middle">count: 3</text>
  <rect class="obj" x="510" y="148" width="130" height="40" rx="8"/>
  <text class="code" x="575" y="173" text-anchor="middle">count: 1</text>
  <path class="line2" d="M140,68 L182,68" marker-end="url(#a2)"/>
  <path class="line2" d="M140,168 L182,168" marker-end="url(#a2)"/>
  <path class="line" d="M442,68 L506,68" marker-end="url(#a1)"/>
  <path class="line" d="M442,168 L506,168" marker-end="url(#a1)"/>
  <text class="txt sub" x="476" y="56" text-anchor="middle">覚えている</text>
  <text class="txt sub" x="476" y="156" text-anchor="middle">覚えている</text>
  <text class="txt sub" x="20" y="218">makeCounter() を呼ぶたびに、新しい count が作られる。だから A と B の count は別々に増える。</text>
</svg>
