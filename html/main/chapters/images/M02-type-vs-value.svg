<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 236" width="700" height="236" role="img" aria-labelledby="t d">
  <title id="t">型チェックが見る型と、実行時の値</title>
  <desc id="d">user、user.age、age の 3 つを横に並べ、上の段に型チェックが見る型、下の段に実行時の値を書いた図。上の段は、user が any、user.age も any、age は書いたとおりの number。any は調べないので、number 型の age に入れてもエラーにならない。下の段は、user が name に "Bob"、age に "20" を持つデータ、user.age が文字列の "20"、age も文字列の "20" のまま。型は number でも、実行時の typeof age は string。</desc>
  <style>
    .txt { fill: #1f2937; font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; font-size: 13px; }
    .sub { fill: #4b5563; font-size: 12px; }
    .code { fill: #1f2937; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; }
    .small { font-size: 11.5px; }
    .head { font-weight: 700; }
    .box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
    .chk-fill { fill: #fff7ed; stroke: #c2410c; stroke-width: 1.5; }
    .chk-txt { fill: #c2410c; font-weight: 700; }
    .run-fill { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
    .run-txt { fill: #1d4ed8; font-weight: 700; }
    .rule { stroke: #cbd5e1; stroke-width: 1; }
    .arrow { fill: none; stroke: #64748b; stroke-width: 1.8; }
    .tip { fill: #64748b; }
    @media (prefers-color-scheme: dark) {
      .txt, .code { fill: #e5e7eb; }
      .sub { fill: #9ca3af; }
      .box { fill: #1e293b; stroke: #64748b; }
      .chk-fill { fill: #431407; stroke: #fb923c; }
      .chk-txt { fill: #fdba74; }
      .run-fill { fill: #172554; stroke: #60a5fa; }
      .run-txt { fill: #93c5fd; }
      .rule { stroke: #334155; }
      .arrow { stroke: #94a3b8; }
      .tip { fill: #94a3b8; }
    }
  </style>
  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="tip" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <!-- 列の見出し -->
  <text class="code head" x="253" y="24" text-anchor="middle">user</text>
  <text class="code head" x="444" y="24" text-anchor="middle">user.age</text>
  <text class="code head" x="611" y="24" text-anchor="middle">age</text>

  <!-- 上の段：型チェックが見る型 -->
  <text class="txt chk-txt" x="10" y="58">型チェックが見る型</text>
  <text class="txt sub" x="10" y="76">コードに書いてある型</text>
  <rect class="box" x="150" y="40" width="206" height="44" rx="8"/>
  <text class="code" x="253" y="67" text-anchor="middle">any</text>
  <path class="arrow" d="M360,62 L380,62" marker-end="url(#m)"/>
  <rect class="box" x="384" y="40" width="120" height="44" rx="8"/>
  <text class="code" x="444" y="67" text-anchor="middle">any</text>
  <path class="arrow" d="M508,62 L528,62" marker-end="url(#m)"/>
  <rect class="chk-fill" x="532" y="40" width="158" height="44" rx="8"/>
  <text class="code head" x="611" y="67" text-anchor="middle">number</text>

  <line class="rule" x1="10" y1="100" x2="690" y2="100"/>

  <!-- 下の段：実行時の値 -->
  <text class="txt run-txt" x="10" y="134">実行時の値</text>
  <text class="txt sub" x="10" y="152">実際に入っているもの</text>
  <rect class="box" x="150" y="116" width="206" height="44" rx="8"/>
  <text class="code small" x="253" y="143" text-anchor="middle">{ name: "Bob", age: "20" }</text>
  <path class="arrow" d="M360,138 L380,138" marker-end="url(#m)"/>
  <rect class="box" x="384" y="116" width="120" height="44" rx="8"/>
  <text class="code" x="444" y="143" text-anchor="middle">"20"</text>
  <path class="arrow" d="M508,138 L528,138" marker-end="url(#m)"/>
  <rect class="run-fill" x="532" y="116" width="158" height="44" rx="8"/>
  <text class="code head" x="611" y="143" text-anchor="middle">"20"</text>

  <!-- 説明 -->
  <text class="txt" x="10" y="194"><tspan class="chk-txt">上の段</tspan>　<tspan class="code">any</tspan> は調べないので、<tspan class="code">number</tspan> 型の <tspan class="code">age</tspan> に入れてもエラーにならない。</text>
  <text class="txt" x="10" y="218"><tspan class="run-txt">下の段</tspan>　値は文字列の <tspan class="code">"20"</tspan> のまま。<tspan class="code">typeof age</tspan> は <tspan class="code">string</tspan>。</text>
</svg>
