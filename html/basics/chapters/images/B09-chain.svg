<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 200" width="660" height="200" role="img" aria-labelledby="t d">
  <title id="t">つなげて書くと、前の結果が次に渡る</title>
  <desc id="d">entries の 3 件の記録のうち、filter で食費の 2 件が残る。その結果に map を呼ぶと、金額の 1200 と 800 を並べた配列になる。</desc>
  <style>
    .txt { fill: #1f2937; font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; font-size: 13px; }
    .sub { fill: #4b5563; font-size: 12px; }
    .head { font-weight: 700; }
    .code { fill: #1f2937; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; }
    .small { font-size: 11.5px; }
    .hl { fill: #2563eb; }
    .var { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
    .obj { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
    .obj2 { fill: none; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 5 3; }
    .win { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
    .bar { fill: #eef1f5; stroke: #94a3b8; stroke-width: 1.5; }
    .rule { fill: none; stroke: #cbd5e1; stroke-width: 1; }
    .dot { fill: #cbd5e1; }
    .line { fill: none; stroke: #2563eb; stroke-width: 1.8; }
    .line2 { fill: none; stroke: #64748b; stroke-width: 1.8; }
    .dash { stroke-dasharray: 5 3; }
    .tip { fill: #2563eb; }
    .tip2 { fill: #64748b; }
    @media (prefers-color-scheme: dark) {
      .txt, .code { fill: #e5e7eb; }
      .sub { fill: #9ca3af; }
      .hl { fill: #60a5fa; }
      .var { fill: #1e293b; stroke: #64748b; }
      .obj { fill: #172554; stroke: #60a5fa; }
      .obj2 { stroke: #64748b; }
      .win { fill: #0f1419; stroke: #64748b; }
      .bar { fill: #1e293b; stroke: #64748b; }
      .rule { stroke: #334155; }
      .dot { fill: #475569; }
      .line { stroke: #60a5fa; }
      .line2 { stroke: #94a3b8; }
      .tip { fill: #60a5fa; }
      .tip2 { fill: #94a3b8; }
    }
  </style>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="tip" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="tip2" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <text class="code" x="20" y="26">entries</text>
  <text class="txt sub" x="275" y="26">filter の結果</text>
  <text class="txt sub" x="530" y="26">map の結果</text>
  <rect class="obj" x="20" y="40" width="150" height="32" rx="6"/>
  <text class="code" x="32" y="61">食費</text><text class="code" x="158" y="61" text-anchor="end">1200</text>
  <rect class="var" x="20" y="80" width="150" height="32" rx="6"/>
  <text class="code" x="32" y="101">交通費</text><text class="code" x="158" y="101" text-anchor="end">500</text>
  <rect class="obj" x="20" y="120" width="150" height="32" rx="6"/>
  <text class="code" x="32" y="141">食費</text><text class="code" x="158" y="141" text-anchor="end">800</text>
  <text class="code hl" x="222" y="84" text-anchor="middle">.filter(…)</text>
  <path class="line" d="M178,96 L268,96" marker-end="url(#a1)"/>
  <text class="txt sub" x="222" y="116" text-anchor="middle">食費だけを残す</text>
  <rect class="obj" x="275" y="60" width="150" height="32" rx="6"/>
  <text class="code" x="287" y="81">食費</text><text class="code" x="413" y="81" text-anchor="end">1200</text>
  <rect class="obj" x="275" y="100" width="150" height="32" rx="6"/>
  <text class="code" x="287" y="121">食費</text><text class="code" x="413" y="121" text-anchor="end">800</text>
  <text class="code hl" x="477" y="84" text-anchor="middle">.map(…)</text>
  <path class="line" d="M433,96 L523,96" marker-end="url(#a1)"/>
  <text class="txt sub" x="477" y="116" text-anchor="middle">金額を取り出す</text>
  <rect class="obj" x="530" y="60" width="110" height="32" rx="6"/>
  <text class="code" x="585" y="81" text-anchor="middle">1200</text>
  <rect class="obj" x="530" y="100" width="110" height="32" rx="6"/>
  <text class="code" x="585" y="121" text-anchor="middle">800</text>
  <text class="txt sub" x="20" y="186">前のメソッドが返した配列に、続けて次のメソッドを呼ぶ。</text>
</svg>
