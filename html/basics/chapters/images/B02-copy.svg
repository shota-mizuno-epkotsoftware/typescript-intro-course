<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 168" width="660" height="168" role="img" aria-labelledby="t d">
  <title id="t">let b = a; は、その時点の a の値を b に入れる</title>
  <desc id="d">2 行目の let b = a; を実行すると、a の値の 10 が b に入り、a も b も 10 になる。3 行目で a に 20 を入れ直しても、b は 10 のまま変わらない。a と b は、つながっていない。</desc>
  <style>
    .txt { fill: #1f2937; font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; font-size: 13px; }
    .sub { fill: #4b5563; font-size: 12px; }
    .head { font-weight: 700; }
    .acc { fill: #2563eb; }
    .code { fill: #1f2937; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; }
    .dim { fill: #6b7280; }
    .var { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
    .obj { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
    .obj2 { fill: none; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 5 3; }
    .pane { fill: none; stroke: #94a3b8; stroke-width: 1; }
    .line { fill: none; stroke: #2563eb; stroke-width: 1.6; }
    .line2 { fill: none; stroke: #64748b; stroke-width: 1.6; }
    .tip { fill: #2563eb; }
    .tip2 { fill: #64748b; }
    .dot { fill: #94a3b8; }
    @media (prefers-color-scheme: dark) {
      .txt, .code { fill: #e5e7eb; }
      .sub { fill: #9ca3af; }
      .acc { fill: #60a5fa; }
      .dim { fill: #9ca3af; }
      .var { fill: #1e293b; stroke: #64748b; }
      .obj { fill: #172554; stroke: #60a5fa; }
      .obj2 { stroke: #64748b; }
      .pane { stroke: #64748b; }
      .line { stroke: #60a5fa; }
      .line2 { stroke: #94a3b8; }
      .tip { fill: #60a5fa; }
      .tip2 { fill: #94a3b8; }
      .dot { fill: #64748b; }
    }
  </style>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="tip" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="tip2" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <text class="txt sub" x="30" y="41">2 行目の後</text>
  <text class="code head" x="150" y="41" text-anchor="end">a</text>
  <rect class="var" x="160" y="16" width="90" height="40" rx="8"/>
  <text class="code" x="205" y="41" text-anchor="middle">10</text>
  <text class="code head" x="400" y="41" text-anchor="end">b</text>
  <rect class="obj" x="410" y="16" width="90" height="40" rx="8"/>
  <text class="code" x="455" y="41" text-anchor="middle">10</text>
  <path class="line" d="M254,36 L374,36" marker-end="url(#a1)"/>
  <text class="txt sub" x="314" y="26" text-anchor="middle">値の 10 を入れる</text>
  <text class="txt sub" x="30" y="109">3 行目の後</text>
  <text class="code head" x="150" y="109" text-anchor="end">a</text>
  <rect class="obj" x="160" y="84" width="90" height="40" rx="8"/>
  <text class="code" x="205" y="109" text-anchor="middle">20</text>
  <text class="code head" x="400" y="109" text-anchor="end">b</text>
  <rect class="var" x="410" y="84" width="90" height="40" rx="8"/>
  <text class="code" x="455" y="109" text-anchor="middle">10</text>
  <text class="txt sub" x="514" y="109">変わらない</text>
  <text class="txt sub" x="30" y="156">b に入ったのは、10 という値。a と b は、つながっていない。</text>
</svg>
