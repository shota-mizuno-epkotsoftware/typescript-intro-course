<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 208" width="660" height="208" role="img" aria-labelledby="t d">
  <title id="t">map は、要素の数だけコールバックを呼ぶ</title>
  <desc id="d">prices の要素は 100、200、300 の 3 つ。1 回目は price に 100 が入り、コールバックは 100 * 2 の 200 を返す。2 回目は price に 200 が入り、400 を返す。3 回目は price に 300 が入り、600 を返す。返した値を同じ順に並べた 200、400、600 の配列が doubled に入る。</desc>
  <style>
    .txt { fill: #1f2937; font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; font-size: 13px; }
    .sub { fill: #4b5563; font-size: 12px; }
    .head { font-weight: 700; }
    .code { fill: #1f2937; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; }
    .dim { fill: #6b7280; }
    .em { fill: #1d4ed8; }
    .var { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
    .obj { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
    .obj2 { fill: #f8fafc; stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 5 3; }
    .area { fill: none; stroke: #cbd5e1; stroke-width: 1.2; }
    .line { fill: none; stroke: #2563eb; stroke-width: 1.8; }
    .line2 { fill: none; stroke: #64748b; stroke-width: 1.8; }
    .tip { fill: #2563eb; }
    .tip2 { fill: #64748b; }
    @media (prefers-color-scheme: dark) {
      .txt, .code { fill: #e5e7eb; }
      .sub, .dim { fill: #9ca3af; }
      .em { fill: #93c5fd; }
      .var { fill: #1e293b; stroke: #64748b; }
      .obj { fill: #172554; stroke: #60a5fa; }
      .obj2 { fill: #1e293b; stroke: #94a3b8; }
      .area { stroke: #475569; }
      .line { stroke: #60a5fa; }
      .line2 { stroke: #94a3b8; }
      .tip { fill: #60a5fa; }
      .tip2 { fill: #94a3b8; }
    }
  </style>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="tip" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="tip2" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <text class="code" x="112" y="26" text-anchor="middle">prices</text>
  <text class="txt sub" x="330" y="26" text-anchor="middle"><tspan class="em">map が呼ぶ</tspan>コールバック（<tspan class="code">price * 2</tspan>）</text>
  <text class="code em head" x="560" y="26" text-anchor="middle">doubled</text>
  <text class="txt sub" x="20" y="65">1 回目</text>
  <rect class="var" x="72" y="44" width="80" height="32" rx="8"/>
  <text class="code" x="112" y="65" text-anchor="middle">100</text>
  <path class="line2" d="M156,60 L256,60" marker-end="url(#a2)"/>
  <text class="txt sub" x="206" y="53" text-anchor="middle">price に 100</text>
  <rect class="var" x="260" y="44" width="140" height="32" rx="8"/>
  <text class="code" x="330" y="65" text-anchor="middle">100 * 2</text>
  <path class="line" d="M404,60 L516,60" marker-end="url(#a1)"/>
  <text class="txt sub" x="460" y="53" text-anchor="middle">200 を返す</text>
  <rect class="obj" x="520" y="44" width="80" height="32" rx="8"/>
  <text class="code" x="560" y="65" text-anchor="middle">200</text>
  <text class="txt sub" x="20" y="109">2 回目</text>
  <rect class="var" x="72" y="88" width="80" height="32" rx="8"/>
  <text class="code" x="112" y="109" text-anchor="middle">200</text>
  <path class="line2" d="M156,104 L256,104" marker-end="url(#a2)"/>
  <text class="txt sub" x="206" y="97" text-anchor="middle">price に 200</text>
  <rect class="var" x="260" y="88" width="140" height="32" rx="8"/>
  <text class="code" x="330" y="109" text-anchor="middle">200 * 2</text>
  <path class="line" d="M404,104 L516,104" marker-end="url(#a1)"/>
  <text class="txt sub" x="460" y="97" text-anchor="middle">400 を返す</text>
  <rect class="obj" x="520" y="88" width="80" height="32" rx="8"/>
  <text class="code" x="560" y="109" text-anchor="middle">400</text>
  <text class="txt sub" x="20" y="153">3 回目</text>
  <rect class="var" x="72" y="132" width="80" height="32" rx="8"/>
  <text class="code" x="112" y="153" text-anchor="middle">300</text>
  <path class="line2" d="M156,148 L256,148" marker-end="url(#a2)"/>
  <text class="txt sub" x="206" y="141" text-anchor="middle">price に 300</text>
  <rect class="var" x="260" y="132" width="140" height="32" rx="8"/>
  <text class="code" x="330" y="153" text-anchor="middle">300 * 2</text>
  <path class="line" d="M404,148 L516,148" marker-end="url(#a1)"/>
  <text class="txt sub" x="460" y="141" text-anchor="middle">600 を返す</text>
  <rect class="obj" x="520" y="132" width="80" height="32" rx="8"/>
  <text class="code" x="560" y="153" text-anchor="middle">600</text>
  <text class="txt sub" x="20" y="196">map が、要素の数だけコールバックを呼ぶ。返した値が、同じ順で新しい配列に並ぶ。</text>
</svg>
