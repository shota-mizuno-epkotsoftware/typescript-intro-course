<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 140" width="660" height="140" role="img" aria-labelledby="t d">
  <title id="t">代入のたびに、値が入れ直される</title>
  <desc id="d">変数 total の値は、1 行目の後は 0、2 行目で 500 を足して 500、3 行目で 300 を足して 800、4 行目で 200 を引いて 600 になる。入れ物は 1 つで、代入のたびに値が入れ直される。</desc>
  <style>
    .txt { fill: #1f2937; font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; font-size: 13px; }
    .sub { fill: #4b5563; font-size: 12px; }
    .head { font-weight: 700; }
    .acc { fill: #2563eb; }
    .code { fill: #1f2937; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; }
    .dim { fill: #6b7280; }
    .var { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
    .obj { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
    .obj2 { fill: none; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 5 3; }
    .pane { fill: none; stroke: #94a3b8; stroke-width: 1; }
    .line { fill: none; stroke: #2563eb; stroke-width: 1.6; }
    .line2 { fill: none; stroke: #64748b; stroke-width: 1.6; }
    .tip { fill: #2563eb; }
    .tip2 { fill: #64748b; }
    .dot { fill: #94a3b8; }
    @media (prefers-color-scheme: dark) {
      .txt, .code { fill: #e5e7eb; }
      .sub { fill: #9ca3af; }
      .acc { fill: #60a5fa; }
      .dim { fill: #9ca3af; }
      .var { fill: #1e293b; stroke: #64748b; }
      .obj { fill: #172554; stroke: #60a5fa; }
      .obj2 { stroke: #64748b; }
      .pane { stroke: #64748b; }
      .line { stroke: #60a5fa; }
      .line2 { stroke: #94a3b8; }
      .tip { fill: #60a5fa; }
      .tip2 { fill: #94a3b8; }
      .dot { fill: #64748b; }
    }
  </style>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="tip" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="tip2" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <text class="txt sub" x="30" y="24">total の値</text>
  <text class="txt sub" x="85" y="50" text-anchor="middle">1 行目の後</text>
  <rect class="var" x="30" y="58" width="110" height="40" rx="8"/>
  <text class="code" x="85" y="83" text-anchor="middle">0</text>
  <path class="line" d="M144,78 L186,78" marker-end="url(#a1)"/>
  <text class="code" x="165" y="68" text-anchor="middle">+ 500</text>
  <text class="txt sub" x="245" y="50" text-anchor="middle">2 行目の後</text>
  <rect class="var" x="190" y="58" width="110" height="40" rx="8"/>
  <text class="code" x="245" y="83" text-anchor="middle">500</text>
  <path class="line" d="M304,78 L346,78" marker-end="url(#a1)"/>
  <text class="code" x="325" y="68" text-anchor="middle">+ 300</text>
  <text class="txt sub" x="405" y="50" text-anchor="middle">3 行目の後</text>
  <rect class="var" x="350" y="58" width="110" height="40" rx="8"/>
  <text class="code" x="405" y="83" text-anchor="middle">800</text>
  <path class="line" d="M464,78 L506,78" marker-end="url(#a1)"/>
  <text class="code" x="485" y="68" text-anchor="middle">- 200</text>
  <text class="txt sub" x="565" y="50" text-anchor="middle">4 行目の後</text>
  <rect class="obj" x="510" y="58" width="110" height="40" rx="8"/>
  <text class="code" x="565" y="83" text-anchor="middle">600</text>
  <text class="txt sub" x="30" y="128">入れ物は 1 つ。代入のたびに、値が入れ直される。計算に使われるのは、その時点の値。</text>
</svg>
