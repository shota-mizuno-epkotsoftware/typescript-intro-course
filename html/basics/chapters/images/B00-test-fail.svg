<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 256" width="720" height="256" role="img" aria-labelledby="t d">
  <title id="t">不合格の表示の読む所</title>
  <desc id="d">不合格の表示には、読む所が 3 つある。1 つ目は ✖ の行の「2 行を表示する」で、通らなかった検査を表す。2 つ目は「期待した表示:」の下の 2 行（基礎編を始めます、よろしくお願いします）で、正しい表示を表す。3 つ目は「実際の表示:」の下の 1 行（基礎編を始めます）で、自分のプログラムの表示を表す。2 つ目と 3 つ目を見比べて、違う行や足りない行を探す。</desc>
  <style>
    .ui { font-family: -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif; font-size: 11px; fill: #9d9d9d; }
    .on { fill: #e7e7e7; }
    .mono { font-family: Menlo, Consolas, "Courier New", monospace; font-size: 12px; fill: #cccccc; }
    .frame { fill: #181818; stroke: #3c3c3c; stroke-width: 1; }
    .edge { fill: none; stroke: #2b2b2b; stroke-width: 1; }
    .blue { fill: #0078d4; }
    .mark { fill: none; stroke: #ea580c; stroke-width: 2; }
    .lead { fill: none; stroke: #ea580c; stroke-width: 1.5; }
    .badge { fill: #ea580c; }
    .badge-num { font-family: -apple-system, "Segoe UI", sans-serif; font-size: 12px; font-weight: 700; fill: #ffffff; }
    .note { font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; font-size: 13px; fill: #1f2937; }
    .note-head { font-weight: 700; }
    .note-sub { fill: #4b5563; }
    @media (prefers-color-scheme: dark) {
      .mark, .lead { stroke: #fb923c; }
      .badge { fill: #f97316; }
      .note { fill: #e5e7eb; }
      .note-sub { fill: #9ca3af; }
    }
  </style>

  <!-- ターミナル -->
  <rect class="frame" x="10" y="10" width="500" height="208" rx="6"/>
  <text class="ui" x="24" y="31">問題</text>
  <text class="ui" x="58" y="31">出力</text>
  <text class="ui on" x="92" y="31">ターミナル</text>
  <rect class="blue" x="90" y="37" width="56" height="1.5"/>
  <path class="edge" d="M10,44 H510"/>
  <text class="mono" x="22" y="66">演習 1</text>
  <text class="mono" x="78" y="66">不合格</text>
  <text class="mono" x="36" y="83">✖ 2 行を表示する</text>
  <text class="mono" x="65" y="100">期待した表示:</text>
  <text class="mono" x="80" y="117">基礎編を始めます</text>
  <text class="mono" x="80" y="134">よろしくお願いします</text>
  <text class="mono" x="65" y="151">実際の表示:</text>
  <text class="mono" x="80" y="168">基礎編を始めます</text>
  <text class="mono" x="22" y="202">結果: 答え合わせをする演習 1 個のうち、0 個が合格です。</text>

  <!-- 印 -->
  <rect class="mark" x="31" y="69" width="126" height="16.5" rx="4"/>
  <rect class="mark" x="60" y="87.5" width="148" height="50" rx="4"/>
  <rect class="mark" x="60" y="139.5" width="148" height="33" rx="4"/>

  <!-- 引き出し線と説明 -->
  <path class="lead" d="M157,77.5 H528"/>
  <path class="lead" d="M208,112.5 H528"/>
  <path class="lead" d="M208,156 H528"/>
  <circle class="badge" cx="540" cy="77.5" r="10"/><text class="badge-num" x="540" y="82" text-anchor="middle">1</text>
  <circle class="badge" cx="540" cy="112.5" r="10"/><text class="badge-num" x="540" y="117" text-anchor="middle">2</text>
  <circle class="badge" cx="540" cy="156" r="10"/><text class="badge-num" x="540" y="160.5" text-anchor="middle">3</text>
  <text class="note note-head" x="556" y="82.5">通らなかった検査</text>
  <text class="note note-head" x="556" y="117.5">正しい表示</text>
  <text class="note note-head" x="556" y="161">自分のプログラムの表示</text>

  <text class="note note-sub" x="10" y="244">② と ③ を見比べて、違う行や足りない行を探す。</text>
</svg>
