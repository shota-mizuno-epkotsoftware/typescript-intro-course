<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 200" width="660" height="200" role="img" aria-labelledby="t d">
  <title id="t">関数は、引数を受け取って戻り値を返す</title>
  <desc id="d">呼び出した所の subtotal(120, 3) から、引数の 120 と 3 が関数に渡る。関数の中で price * count が計算され、戻り値の 360 が呼び出した所に返る。呼び出しは 360 に置き換わる。</desc>
  <style>
    .txt { fill: #1f2937; font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; font-size: 13px; }
    .sub { fill: #4b5563; font-size: 12px; }
    .head { font-weight: 700; }
    .code { fill: #1f2937; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; }
    .dim { fill: #6b7280; }
    .var { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
    .obj { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
    .obj2 { fill: #f8fafc; stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 5 3; }
    .line { fill: none; stroke: #2563eb; stroke-width: 1.8; }
    .line2 { fill: none; stroke: #64748b; stroke-width: 1.8; }
    .tip { fill: #2563eb; }
    .tip2 { fill: #64748b; }
    @media (prefers-color-scheme: dark) {
      .txt, .code { fill: #e5e7eb; }
      .sub, .dim { fill: #9ca3af; }
      .var { fill: #1e293b; stroke: #64748b; }
      .obj { fill: #172554; stroke: #60a5fa; }
      .obj2 { fill: #1e293b; stroke: #94a3b8; }
      .line { stroke: #60a5fa; }
      .line2 { stroke: #94a3b8; }
      .tip { fill: #60a5fa; }
      .tip2 { fill: #94a3b8; }
    }
  </style>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="tip" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="tip2" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <text class="txt sub" x="20" y="58">呼び出した所</text>
  <rect class="var" x="20" y="70" width="180" height="44" rx="6"/>
  <text class="code" x="110" y="97" text-anchor="middle">subtotal(120, 3)</text>
  <text class="txt sub" x="20" y="136">呼び出しが 360 に置き換わる</text>
  <text class="txt sub" x="360" y="38">関数の中</text>
  <rect class="obj2" x="360" y="50" width="285" height="84" rx="8"/>
  <text class="code" x="372" y="76">function subtotal(price, count) {</text>
  <text class="code" x="372" y="96" xml:space="preserve">  return price * count;</text>
  <text class="code" x="372" y="116">}</text>
  <path class="line2" d="M200,82 L356,82" marker-end="url(#a2)"/>
  <text class="txt sub" x="278" y="72" text-anchor="middle">引数 120 と 3 を渡す</text>
  <path class="line" d="M360,104 L204,104" marker-end="url(#a1)"/>
  <text class="txt sub" x="278" y="124" text-anchor="middle">戻り値 360 を返す</text>
  <text class="txt sub" x="20" y="186">関数は引数を受け取り、計算した結果を呼び出した所に返す。</text>
</svg>
