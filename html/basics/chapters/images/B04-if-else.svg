<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 200" width="660" height="200" role="img" aria-labelledby="t d">
  <title id="t">if と else の分かれ道</title>
  <desc id="d">条件 total >= 3000 を調べる。true のときは if の { } の中を実行し、false のときは else の { } の中を実行する。どちらの場合も、その後は次の行へ進む。</desc>
  <style>
    .txt { fill: #1f2937; font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; font-size: 13px; }
    .sub { fill: #4b5563; font-size: 12px; }
    .head { font-weight: 700; }
    .code { fill: #1f2937; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; }
    .dim { fill: #6b7280; }
    .var { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
    .obj { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
    .obj2 { fill: #f8fafc; stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 5 3; }
    .line { fill: none; stroke: #2563eb; stroke-width: 1.8; }
    .line2 { fill: none; stroke: #64748b; stroke-width: 1.8; }
    .tip { fill: #2563eb; }
    .tip2 { fill: #64748b; }
    @media (prefers-color-scheme: dark) {
      .txt, .code { fill: #e5e7eb; }
      .sub, .dim { fill: #9ca3af; }
      .var { fill: #1e293b; stroke: #64748b; }
      .obj { fill: #172554; stroke: #60a5fa; }
      .obj2 { fill: #1e293b; stroke: #94a3b8; }
      .line { stroke: #60a5fa; }
      .line2 { stroke: #94a3b8; }
      .tip { fill: #60a5fa; }
      .tip2 { fill: #94a3b8; }
    }
  </style>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="tip" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="tip2" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <text class="txt sub" x="20" y="70">条件</text>
  <rect class="obj" x="20" y="80" width="170" height="40" rx="8"/>
  <text class="code" x="105" y="105" text-anchor="middle">total &gt;= 3000</text>
  <rect class="var" x="290" y="30" width="210" height="40" rx="6"/>
  <text class="txt" x="395" y="55" text-anchor="middle">if の { } の中を実行</text>
  <rect class="var" x="290" y="130" width="210" height="40" rx="6"/>
  <text class="txt" x="395" y="155" text-anchor="middle">else の { } の中を実行</text>
  <rect class="var" x="566" y="80" width="84" height="40" rx="6"/>
  <text class="txt" x="608" y="105" text-anchor="middle">次の行へ</text>
  <path class="line" d="M190,92 L286,54" marker-end="url(#a1)"/>
  <path class="line" d="M190,108 L286,146" marker-end="url(#a1)"/>
  <text class="code" x="226" y="60" text-anchor="middle">true</text>
  <text class="code" x="226" y="150" text-anchor="middle">false</text>
  <path class="line2" d="M500,54 L562,92" marker-end="url(#a2)"/>
  <path class="line2" d="M500,146 L562,108" marker-end="url(#a2)"/>
  <text class="txt sub" x="20" y="190">2 つの { } のうち、どちらか一方だけが実行される。</text>
</svg>
