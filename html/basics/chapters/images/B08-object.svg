<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 216" width="660" height="216" role="img" aria-labelledby="t d">
  <title id="t">オブジェクトは、名前の付いた値の集まり</title>
  <desc id="d">変数 entry に、1 つのオブジェクトが入っている。オブジェクトには、date と "2026-04-01"、category と "食費"、amount と 1200 という、名前と値の組が 3 つ並んでいる。entry.amount と書くと、amount の値の 1200 が取り出される。</desc>
  <style>
    .txt { fill: #1f2937; font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; font-size: 13px; }
    .sub { fill: #4b5563; font-size: 12px; }
    .code { fill: #1f2937; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; }
    .em { fill: #1d4ed8; }
    .head { font-weight: 700; }
    .var { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
    .obj { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
    .obj2 { fill: #f8fafc; stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 5 3; }
    .sep { stroke: #cbd5e1; stroke-width: 1; }
    .line { fill: none; stroke: #2563eb; stroke-width: 1.8; }
    .line2 { fill: none; stroke: #64748b; stroke-width: 1.8; }
    .tip { fill: #2563eb; }
    .tip2 { fill: #64748b; }
    @media (prefers-color-scheme: dark) {
      .txt, .code { fill: #e5e7eb; }
      .sub { fill: #9ca3af; }
      .em { fill: #93c5fd; }
      .var { fill: #1e293b; stroke: #64748b; }
      .obj { fill: #172554; stroke: #60a5fa; }
      .obj2 { fill: #1e293b; stroke: #94a3b8; }
      .sep { stroke: #475569; }
      .line { stroke: #60a5fa; }
      .line2 { stroke: #94a3b8; }
      .tip { fill: #60a5fa; }
      .tip2 { fill: #94a3b8; }
    }
  </style>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="tip" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="tip2" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <text class="txt sub" x="20" y="24">名前</text>
  <text class="code head" x="54" y="24">entry</text>
  <text class="txt sub" x="36" y="50">プロパティの名前</text>
  <text class="txt sub" x="160" y="50">値</text>
  <rect class="var" x="20" y="60" width="290" height="126" rx="8"/>
  <rect class="obj" x="21" y="144" width="288" height="41" rx="7"/>
  <path class="sep" d="M20,102 L310,102"/>
  <path class="sep" d="M20,144 L310,144"/>
  <path class="sep" d="M145,60 L145,186"/>
  <text class="code" x="36" y="86">date</text>
  <text class="code" x="160" y="86">"2026-04-01"</text>
  <text class="code" x="36" y="128">category</text>
  <text class="code" x="160" y="128">"食費"</text>
  <text class="code em" x="36" y="169">amount</text>
  <text class="code em" x="160" y="169">1200</text>
  <path class="line" d="M310,165 L366,165" marker-end="url(#a1)"/>
  <text class="code" x="372" y="140">entry.amount</text>
  <rect class="obj" x="370" y="148" width="100" height="34" rx="6"/>
  <text class="code em" x="420" y="170" text-anchor="middle">1200</text>
  <text class="txt sub" x="20" y="208">名前を指定して、その値を取り出す。</text>
</svg>
