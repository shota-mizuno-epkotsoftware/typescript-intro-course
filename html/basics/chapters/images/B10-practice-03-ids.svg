<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 238" width="620" height="238" role="img" aria-labelledby="t d">
  <title id="t">演習 3 の画面と、id と変数</title>
  <desc id="d">演習 3 のページには、上から「演習 3」の見出し、入力欄と「足す」のボタン、「合計: 0円」の文章が並んでいる。入力欄は id が amount で、practice-03-page.js の変数 amount に入っている。「足す」のボタンは id が add で、変数 button に入っている。「合計: 0円」の要素は id が total で、変数 totalText に入っている。</desc>
  <!-- ページの部分を切り出した図（実物の大きさ）。要素の位置と大きさは、practice-03.html をブラウザで開いて測った -->
  <style>
    .pg { font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif; font-size: 16px; fill: #1f2328; }
    .h1 { font-size: 20px; font-weight: 600; }
    .frame { fill: #ffffff; stroke: #c4c7c5; stroke-width: 1; }
    .btn { fill: #efefef; stroke: #767676; stroke-width: 1; }
    .input { fill: #ffffff; stroke: #767676; stroke-width: 1; }
    .mark { fill: none; stroke: #ea580c; stroke-width: 1.5; }
    .lead { fill: none; stroke: #ea580c; stroke-width: 1; }
    .tag { fill: none; stroke: #ea580c; stroke-width: 1.2; }
    .tag-txt { font-family: Menlo, Consolas, "Courier New", monospace; font-size: 11px; font-weight: 700; fill: #c2410c; }
    .var { font-family: Menlo, Consolas, "Courier New", monospace; font-size: 12px; fill: #1f2937; }
    .note { font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; font-size: 13px; fill: #1f2937; }
    .note-head { font-weight: 700; }
    .note-sub { fill: #4b5563; }
    @media (prefers-color-scheme: dark) {
      .mark, .lead, .tag { stroke: #fb923c; }
      .tag-txt { fill: #fb923c; }
      .var, .note { fill: #e5e7eb; }
      .note-sub { fill: #9ca3af; }
    }
  </style>

  <!-- ページ -->
  <rect class="frame" x="10" y="10" width="360" height="168" rx="4"/>
  <text class="pg h1" x="26" y="52">演習 3</text>
  <rect class="input" x="26.5" y="75.5" width="207" height="40" rx="2"/>
  <rect class="btn" x="240.5" y="75.5" width="54" height="40" rx="3"/>
  <text class="pg" x="267.5" y="101" text-anchor="middle">足す</text>
  <text class="pg" x="26" y="151">合計: 0円</text>

  <!-- id の付いた要素の囲み、線、札 -->
  <rect class="mark" x="23" y="72" width="213" height="47" rx="3"/>
  <rect class="mark" x="238" y="72" width="59" height="47" rx="3"/>
  <rect class="mark" x="20" y="133" width="84" height="25" rx="3"/>
  <path class="lead" d="M130,72 V64 H400"/>
  <path class="lead" d="M297,95.5 H400"/>
  <path class="lead" d="M104,145.5 H400"/>
  <text class="note note-head" x="400" y="42">id</text>
  <text class="note note-head" x="490" y="42">変数</text>
  <rect class="tag" x="400" y="55" width="74" height="18" rx="4"/><text class="tag-txt" x="408" y="68">#amount</text>
  <text class="var" x="490" y="68">amount</text>
  <rect class="tag" x="400" y="86.5" width="74" height="18" rx="4"/><text class="tag-txt" x="408" y="99.5">#add</text>
  <text class="var" x="490" y="99.5">button</text>
  <rect class="tag" x="400" y="136.5" width="74" height="18" rx="4"/><text class="tag-txt" x="408" y="149.5">#total</text>
  <text class="var" x="490" y="149.5">totalText</text>

  <!-- 下の説明 -->
  <text class="note note-sub" x="10" y="204">オレンジの札は、practice-03.html でその要素に付けた id。</text>
  <text class="note note-sub" x="10" y="226">右の名前は、practice-03-page.js でその要素を入れてある変数。</text>
</svg>
