<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 180" width="660" height="180" role="img" aria-labelledby="t d">
  <title id="t">配列は、番号の付いた要素の並び</title>
  <desc id="d">変数 prices に入った配列に、120、80、300 の 3 つの要素が並んでいる。番号は左から 0、1、2 で、prices[0] が 120、prices[1] が 80、prices[2] が 300。prices.length は 3。</desc>
  <style>
    .txt { fill: #1f2937; font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; font-size: 13px; }
    .sub { fill: #4b5563; font-size: 12px; }
    .head { font-weight: 700; }
    .code { fill: #1f2937; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; }
    .dim { fill: #6b7280; }
    .var { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
    .obj { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
    .obj2 { fill: #f8fafc; stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 5 3; }
    .line { fill: none; stroke: #2563eb; stroke-width: 1.8; }
    .line2 { fill: none; stroke: #64748b; stroke-width: 1.8; }
    .tip { fill: #2563eb; }
    .tip2 { fill: #64748b; }
    @media (prefers-color-scheme: dark) {
      .txt, .code { fill: #e5e7eb; }
      .sub, .dim { fill: #9ca3af; }
      .var { fill: #1e293b; stroke: #64748b; }
      .obj { fill: #172554; stroke: #60a5fa; }
      .obj2 { fill: #1e293b; stroke: #94a3b8; }
      .line { stroke: #60a5fa; }
      .line2 { stroke: #94a3b8; }
      .tip { fill: #60a5fa; }
      .tip2 { fill: #94a3b8; }
    }
  </style>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="tip" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="tip2" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <text class="txt sub" x="20" y="24">名前</text>
  <text class="code head" x="54" y="24">prices</text>
  <rect class="obj" x="20" y="70" width="100" height="40"/>
  <rect class="obj" x="120" y="70" width="100" height="40"/>
  <rect class="obj" x="220" y="70" width="100" height="40"/>
  <text class="code" x="70" y="95" text-anchor="middle">120</text>
  <text class="code" x="170" y="95" text-anchor="middle">80</text>
  <text class="code" x="270" y="95" text-anchor="middle">300</text>
  <text class="code" x="70" y="58" text-anchor="middle">prices[0]</text>
  <text class="code" x="170" y="58" text-anchor="middle">prices[1]</text>
  <text class="code" x="270" y="58" text-anchor="middle">prices[2]</text>
  <text class="txt sub" x="70" y="130" text-anchor="middle">番号 0</text>
  <text class="txt sub" x="170" y="130" text-anchor="middle">番号 1</text>
  <text class="txt sub" x="270" y="130" text-anchor="middle">番号 2</text>
  <text class="txt sub" x="344" y="86">要素は 3 つ</text>
  <text class="code" x="344" y="106">prices.length は 3</text>
  <text class="txt sub" x="20" y="166">番号は 0 から始まる。</text>
</svg>
