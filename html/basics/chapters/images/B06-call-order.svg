<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 250" width="660" height="250" role="img" aria-labelledby="t d">
  <title id="t">関数の中は、呼ばれたときに実行される</title>
  <desc id="d">1 行目で A を表示する。3〜5 行目は関数 show を作るだけで、中の console.log("B") は実行されない。7 行目で C を表示する。8 行目の show(); で関数が呼ばれ、4 行目が実行されて B を表示する。その後、呼び出した行の次の 9 行目に戻り、D を表示する。</desc>
  <style>
    .txt { fill: #1f2937; font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; font-size: 13px; }
    .sub { fill: #4b5563; font-size: 12px; }
    .head { font-weight: 700; }
    .code { fill: #1f2937; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; }
    .dim { fill: #6b7280; }
    .var { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
    .obj { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
    .area { fill: none; stroke: #cbd5e1; stroke-width: 1.2; }
    .line { fill: none; stroke: #2563eb; stroke-width: 1.8; }
    .line2 { fill: none; stroke: #64748b; stroke-width: 1.8; }
    .tip { fill: #2563eb; }
    .tip2 { fill: #64748b; }
    @media (prefers-color-scheme: dark) {
      .txt, .code { fill: #e5e7eb; }
      .sub, .dim { fill: #9ca3af; }
      .var { fill: #1e293b; stroke: #64748b; }
      .obj { fill: #172554; stroke: #60a5fa; }
      .area { stroke: #475569; }
      .line { stroke: #60a5fa; }
      .line2 { stroke: #94a3b8; }
      .tip { fill: #60a5fa; }
      .tip2 { fill: #94a3b8; }
    }
  </style>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="tip" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="tip2" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="area" x="44" y="60" width="166" height="62" rx="6"/>
  <text class="code dim" x="34" y="34" text-anchor="end">1</text>
  <text class="code" x="50" y="34" xml:space="preserve">console.log("A");</text>
  <text class="code dim" x="34" y="54" text-anchor="end">2</text>
  <text class="code dim" x="34" y="74" text-anchor="end">3</text>
  <text class="code" x="50" y="74" xml:space="preserve">function show() {</text>
  <text class="code dim" x="34" y="94" text-anchor="end">4</text>
  <text class="code" x="50" y="94" xml:space="preserve">  console.log("B");</text>
  <text class="code dim" x="34" y="114" text-anchor="end">5</text>
  <text class="code" x="50" y="114" xml:space="preserve">}</text>
  <text class="code dim" x="34" y="134" text-anchor="end">6</text>
  <text class="code dim" x="34" y="154" text-anchor="end">7</text>
  <text class="code" x="50" y="154" xml:space="preserve">console.log("C");</text>
  <text class="code dim" x="34" y="174" text-anchor="end">8</text>
  <text class="code" x="50" y="174" xml:space="preserve">show();</text>
  <text class="code dim" x="34" y="194" text-anchor="end">9</text>
  <text class="code" x="50" y="194" xml:space="preserve">console.log("D");</text>
  <path class="line" d="M112,170 L254,170 Q262,170 262,162 L262,98 Q262,90 254,90 L216,90" marker-end="url(#a1)"/>
  <path class="line2" d="M68,110 L230,110 Q238,110 238,118 L238,182 Q238,190 230,190 L186,190" marker-end="url(#a2)"/>
  <text class="txt sub" x="232" y="146" text-anchor="end">戻る</text>
  <text class="txt" x="300" y="34">① A を表示</text>
  <text class="txt" x="300" y="94">② 関数を作るだけ。中は、まだ実行されない</text>
  <text class="txt" x="300" y="154">③ C を表示</text>
  <text class="txt" x="300" y="174">④ show を呼ぶ。4 行目を実行して、B を表示</text>
  <text class="txt" x="300" y="194">⑤ 呼び出した行の次に戻り、D を表示</text>
  <text class="txt sub" x="20" y="236">表示は A、C、B、D の順。</text>
</svg>
