<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 260" width="660" height="260" role="img" aria-labelledby="t d">
  <title id="t">中で宣言した変数は外と別、宣言がなければ外の変数</title>
  <desc id="d">関数の外に price と count がある。外の price は 100 のまま変わらない。show の { } の中には引数の price があり、300 が入って 350 に入れ直される。これは外の price とは別の変数。addOne の { } の中には count の宣言がないので、外の count を入れ直す。外の count は 0 から 1、2 と変わる。</desc>
  <style>
    .txt { fill: #1f2937; font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; font-size: 13px; }
    .sub { fill: #4b5563; font-size: 12px; }
    .head { font-weight: 700; }
    .code { fill: #1f2937; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; }
    .dim { fill: #6b7280; }
    .em { fill: #1d4ed8; }
    .var { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
    .obj { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
    .obj2 { fill: #f8fafc; stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 5 3; }
    .area { fill: none; stroke: #cbd5e1; stroke-width: 1.2; }
    .line { fill: none; stroke: #2563eb; stroke-width: 1.8; }
    .line2 { fill: none; stroke: #64748b; stroke-width: 1.8; }
    .tip { fill: #2563eb; }
    .tip2 { fill: #64748b; }
    @media (prefers-color-scheme: dark) {
      .txt, .code { fill: #e5e7eb; }
      .sub, .dim { fill: #9ca3af; }
      .em { fill: #93c5fd; }
      .var { fill: #1e293b; stroke: #64748b; }
      .obj { fill: #172554; stroke: #60a5fa; }
      .obj2 { fill: #1e293b; stroke: #94a3b8; }
      .area { stroke: #475569; }
      .line { stroke: #60a5fa; }
      .line2 { stroke: #94a3b8; }
      .tip { fill: #60a5fa; }
      .tip2 { fill: #94a3b8; }
    }
  </style>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="tip" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="tip2" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <text class="txt sub" x="24" y="24">関数の外</text>
  <rect class="area" x="10" y="34" width="640" height="192" rx="10"/>
  <text class="code head" x="28" y="85">price</text>
  <rect class="var" x="80" y="64" width="64" height="32" rx="8"/>
  <text class="code" x="112" y="85" text-anchor="middle">100</text>
  <text class="txt sub" x="158" y="85">100 のまま（②）</text>
  <text class="code head" x="28" y="173">count</text>
  <rect class="var" x="80" y="152" width="44" height="32" rx="8"/>
  <text class="code" x="102" y="173" text-anchor="middle">0</text>
  <path class="line2" d="M128,168 L156,168" marker-end="url(#a2)"/>
  <text class="code" x="141" y="160" text-anchor="middle">+1</text>
  <rect class="var" x="160" y="152" width="44" height="32" rx="8"/>
  <text class="code" x="182" y="173" text-anchor="middle">1</text>
  <path class="line2" d="M208,168 L236,168" marker-end="url(#a2)"/>
  <text class="code" x="221" y="160" text-anchor="middle">+1</text>
  <rect class="var" x="240" y="152" width="44" height="32" rx="8"/>
  <text class="code" x="262" y="173" text-anchor="middle">2</text>
  <text class="txt sub" x="80" y="206">addOne を 2 回呼んで 2（③）</text>
  <rect class="area" x="340" y="46" width="298" height="92" rx="8"/>
  <text class="txt sub" x="352" y="64">show の { } の中</text>
  <text class="code head" x="352" y="97">price</text>
  <rect class="obj" x="404" y="76" width="64" height="32" rx="8"/>
  <text class="code" x="436" y="97" text-anchor="middle">300</text>
  <path class="line2" d="M472,92 L514,92" marker-end="url(#a2)"/>
  <text class="code" x="492" y="84" text-anchor="middle">+50</text>
  <rect class="obj" x="518" y="76" width="64" height="32" rx="8"/>
  <text class="code" x="550" y="97" text-anchor="middle">350</text>
  <text class="txt sub" x="590" y="97">（①）</text>
  <text class="txt sub em" x="352" y="128">引数の price。外の price とは別の変数</text>
  <rect class="area" x="340" y="148" width="298" height="66" rx="8"/>
  <text class="txt sub" x="352" y="166">addOne の { } の中</text>
  <text class="txt sub em" x="352" y="198">count の宣言がない。外の count を入れ直す</text>
  <path class="line" d="M340,176 L292,170" marker-end="url(#a1)"/>
  <text class="txt sub" x="10" y="248">同じ名前でも、関数の中で宣言した変数と引数は、外の変数とは別の入れ物。</text>
</svg>
