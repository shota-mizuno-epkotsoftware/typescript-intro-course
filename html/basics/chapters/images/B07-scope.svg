<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 262" width="660" height="262" role="img" aria-labelledby="t d">
  <title id="t">変数が使える範囲</title>
  <desc id="d">関数の外で const taxPercent = 10; を宣言し、その下に function withTax(price) { return price + price * taxPercent / 100; } がある。引数の price は、withTax の { } の中の変数。{ } の中からは、外の taxPercent を使える。関数の外で console.log(price) と書いても、中の price は使えない。</desc>
  <style>
    .txt { fill: #1f2937; font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; font-size: 13px; }
    .sub { fill: #4b5563; font-size: 12px; }
    .code { fill: #1f2937; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; }
    .em { fill: #1d4ed8; }
    .head { font-weight: 700; }
    .obj { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
    .area { fill: none; stroke: #cbd5e1; stroke-width: 1.2; }
    .line { fill: none; stroke: #2563eb; stroke-width: 1.8; }
    .line2 { fill: none; stroke: #64748b; stroke-width: 1.8; }
    .tip { fill: #2563eb; }
    .tip2 { fill: #64748b; }
    @media (prefers-color-scheme: dark) {
      .txt, .code { fill: #e5e7eb; }
      .sub { fill: #9ca3af; }
      .em { fill: #93c5fd; }
      .obj { fill: #172554; stroke: #60a5fa; }
      .area { stroke: #475569; }
      .line { stroke: #60a5fa; }
      .line2 { stroke: #94a3b8; }
      .tip { fill: #60a5fa; }
      .tip2 { fill: #94a3b8; }
    }
  </style>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="tip" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="tip2" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="area" x="10" y="34" width="640" height="196" rx="10"/>
  <text class="txt sub" x="24" y="24">関数の外</text>
  <text class="code" x="28" y="60">const <tspan class="em head">taxPercent</tspan> = 10;</text>
  <rect class="obj" x="28" y="82" width="390" height="80" rx="8"/>
  <text class="txt sub" x="408" y="152" text-anchor="end">withTax の { } の中</text>
  <text class="code" x="42" y="104">function withTax(<tspan class="head">price</tspan>) {</text>
  <text class="code" x="60" y="128">return price + price * <tspan class="em head">taxPercent</tspan> / 100;</text>
  <text class="code" x="42" y="152">}</text>
  <path class="line" d="M287,114 L287,72 L111,72 L111,66" marker-end="url(#a1)"/>
  <text class="txt em" x="297" y="98">中からは使える</text>
  <text class="code" x="28" y="214">console.log(<tspan class="head">price</tspan>);</text>
  <path class="line2" d="M139,200 L139,166" marker-end="url(#a2)"/>
  <text class="txt sub" x="133" y="178" text-anchor="end">✕</text>
  <text class="txt sub" x="150" y="190">外からは使えない</text>
  <text class="txt sub" x="10" y="252">関数の中で宣言した変数と引数は、その関数の { } の中でだけ使える。</text>
</svg>
