<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 210" width="660" height="210" role="img" aria-labelledby="t d">
  <title id="t">エラーが見つかる時点</title>
  <desc id="d">SyntaxError は、実行を始める前に、ファイルの書き方を調べる所で見つかる。1 行も実行されない。ReferenceError と TypeError は、その行を実行するときに起きる。問題 1 のプログラムでは、1 行目から 3 行目までは実行され、4 行目で止まり、5 行目は実行されない。</desc>
  <style>
    .txt { fill: #1f2937; font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; font-size: 13px; }
    .sub { fill: #4b5563; font-size: 12px; }
    .head { font-weight: 700; }
    .acc { fill: #2563eb; }
    .code { fill: #1f2937; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; }
    .dim { fill: #6b7280; }
    .var { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
    .obj { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
    .obj2 { fill: none; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 5 3; }
    .pane { fill: none; stroke: #94a3b8; stroke-width: 1; }
    .line { fill: none; stroke: #2563eb; stroke-width: 1.6; }
    .line2 { fill: none; stroke: #64748b; stroke-width: 1.6; }
    .tip { fill: #2563eb; }
    .tip2 { fill: #64748b; }
    .dot { fill: #94a3b8; }
    @media (prefers-color-scheme: dark) {
      .txt, .code { fill: #e5e7eb; }
      .sub { fill: #9ca3af; }
      .acc { fill: #60a5fa; }
      .dim { fill: #9ca3af; }
      .var { fill: #1e293b; stroke: #64748b; }
      .obj { fill: #172554; stroke: #60a5fa; }
      .obj2 { stroke: #64748b; }
      .pane { stroke: #64748b; }
      .line { stroke: #60a5fa; }
      .line2 { stroke: #94a3b8; }
      .tip { fill: #60a5fa; }
      .tip2 { fill: #94a3b8; }
      .dot { fill: #64748b; }
    }
  </style>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="tip" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="tip2" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <text class="txt sub" x="196" y="20">実行を始める前</text>
  <text class="txt sub" x="350" y="20">実行（上の行から順に）</text>
  <path class="pane" d="M336,8 L336,170"/>
  <text class="code head" x="20" y="60">SyntaxError</text>
  <rect class="obj" x="196" y="38" width="124" height="36" rx="6"/>
  <text class="txt" x="258" y="61" text-anchor="middle">書き方を調べる</text>
  <text class="txt head acc" x="258" y="92" text-anchor="middle">ここで見つかる</text>
  <rect class="obj2" x="350" y="38" width="290" height="36" rx="6"/>
  <text class="txt sub" x="495" y="61" text-anchor="middle">1 行も実行されない</text>
  <text class="code head" x="20" y="136">ReferenceError</text>
  <text class="code head" x="20" y="154">TypeError</text>
  <rect class="var" x="196" y="122" width="124" height="36" rx="6"/>
  <text class="txt" x="258" y="145" text-anchor="middle">書き方を調べる</text>
  <rect class="var" x="350" y="122" width="52" height="36" rx="6"/>
  <text class="txt" x="376" y="145" text-anchor="middle">1 行目</text>
  <rect class="var" x="408" y="122" width="52" height="36" rx="6"/>
  <text class="txt" x="434" y="145" text-anchor="middle">2 行目</text>
  <rect class="var" x="466" y="122" width="52" height="36" rx="6"/>
  <text class="txt" x="492" y="145" text-anchor="middle">3 行目</text>
  <rect class="obj" x="524" y="122" width="52" height="36" rx="6"/>
  <text class="txt" x="550" y="145" text-anchor="middle">4 行目</text>
  <rect class="obj2" x="582" y="122" width="52" height="36" rx="6"/>
  <text class="txt sub" x="608" y="145" text-anchor="middle">5 行目</text>
  <text class="txt sub" x="434" y="178" text-anchor="middle">実行される</text>
  <text class="txt head acc" x="550" y="178" text-anchor="middle">ここで止まる</text>
  <text class="txt sub" x="20" y="200">問題 1 のプログラムは、4 行目でエラーになる。5 行目は実行されない。</text>
</svg>
