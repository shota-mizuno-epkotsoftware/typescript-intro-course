<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 252" width="660" height="252" role="img" aria-labelledby="t d">
  <title id="t">オブジェクトの配列を、1 件ずつ取り出す</title>
  <desc id="d">entries には記録が 3 件ある。if の条件は entry.category === "食費"。1 回目の記録は食費の 1200 で、条件が true なので、total は 1200 になる。2 回目の記録は交通費の 500 で、条件が false なので、total は 1200 のまま。3 回目の記録は食費の 800 で、条件が true なので、total は 2000 になる。</desc>
  <style>
    .txt { fill: #1f2937; font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; font-size: 13px; }
    .sub { fill: #4b5563; font-size: 12px; }
    .code { fill: #1f2937; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; }
    .em { fill: #1d4ed8; }
    .var { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
    .obj { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
    .small { font-size: 11px; }
    .sep { stroke: #cbd5e1; stroke-width: 1; }
    .line { fill: none; stroke: #2563eb; stroke-width: 1.8; }
    .line2 { fill: none; stroke: #64748b; stroke-width: 1.8; }
    .tip { fill: #2563eb; }
    .tip2 { fill: #64748b; }
    @media (prefers-color-scheme: dark) {
      .txt, .code { fill: #e5e7eb; }
      .sub { fill: #9ca3af; }
      .em { fill: #93c5fd; }
      .var { fill: #1e293b; stroke: #64748b; }
      .obj { fill: #172554; stroke: #60a5fa; }
      .sep { stroke: #475569; }
      .line { stroke: #60a5fa; }
      .line2 { stroke: #94a3b8; }
      .tip { fill: #60a5fa; }
      .tip2 { fill: #94a3b8; }
    }
  </style>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="tip" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="tip2" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <text class="txt sub" x="20" y="22">entry（回ごとに、次の記録が入る）</text>
  <text class="txt sub" x="318" y="22">if の条件</text>
  <text class="code small sub" x="318" y="38">entry.category === "食費"</text>
  <text class="txt sub" x="520" y="22">回の終わりの total</text>
  <text class="txt sub" x="20" y="44">1 回目</text>
  <rect class="obj" x="20" y="50" width="250" height="36" rx="6"/>
  <text class="code" x="34" y="73">category: "食費", amount: 1200</text>
  <path class="line" d="M270,68 L310,68" marker-end="url(#a1)"/>
  <text class="code em" x="318" y="73">true</text>
  <text class="txt em" x="372" y="73">足す</text>
  <path class="line" d="M440,68 L514,68" marker-end="url(#a1)"/>
  <rect class="obj" x="520" y="50" width="110" height="36" rx="6"/>
  <text class="code em" x="575" y="73" text-anchor="middle">1200</text>
  <text class="txt sub" x="20" y="106">2 回目</text>
  <rect class="var" x="20" y="112" width="250" height="36" rx="6"/>
  <text class="code" x="34" y="135">category: "交通費", amount: 500</text>
  <path class="line2" d="M270,130 L310,130" marker-end="url(#a2)"/>
  <text class="code" x="318" y="135">false</text>
  <text class="txt sub" x="372" y="135">足さない</text>
  <path class="line2" d="M440,130 L514,130" marker-end="url(#a2)"/>
  <rect class="var" x="520" y="112" width="110" height="36" rx="6"/>
  <text class="code" x="575" y="135" text-anchor="middle">1200</text>
  <text class="txt sub" x="20" y="168">3 回目</text>
  <rect class="obj" x="20" y="174" width="250" height="36" rx="6"/>
  <text class="code" x="34" y="197">category: "食費", amount: 800</text>
  <path class="line" d="M270,192 L310,192" marker-end="url(#a1)"/>
  <text class="code em" x="318" y="197">true</text>
  <text class="txt em" x="372" y="197">足す</text>
  <path class="line" d="M440,192 L514,192" marker-end="url(#a1)"/>
  <rect class="obj" x="520" y="174" width="110" height="36" rx="6"/>
  <text class="code em" x="575" y="197" text-anchor="middle">2000</text>
  <text class="txt sub" x="20" y="240">条件が true の回だけ、entry.amount が total に足される。</text>
</svg>
