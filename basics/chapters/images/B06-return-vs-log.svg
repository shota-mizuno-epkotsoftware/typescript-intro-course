<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 220" width="660" height="220" role="img" aria-labelledby="t d">
  <title id="t">return と console.log の違い</title>
  <desc id="d">showDouble(5) は、関数の中の console.log(n * 2); でターミナルに 10 を表示するが、戻り値は undefined。double(5) は、関数の中の return n * 2; で 10 を呼び出した所に返し、ターミナルには何も表示しない。</desc>
  <style>
    .txt { fill: #1f2937; font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; font-size: 13px; }
    .sub { fill: #4b5563; font-size: 12px; }
    .head { font-weight: 700; }
    .code { fill: #1f2937; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; }
    .dim { fill: #6b7280; }
    .var { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
    .obj { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
    .obj2 { fill: #f8fafc; stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 5 3; }
    .line { fill: none; stroke: #2563eb; stroke-width: 1.8; }
    .line2 { fill: none; stroke: #64748b; stroke-width: 1.8; }
    .tip { fill: #2563eb; }
    .tip2 { fill: #64748b; }
    @media (prefers-color-scheme: dark) {
      .txt, .code { fill: #e5e7eb; }
      .sub, .dim { fill: #9ca3af; }
      .var { fill: #1e293b; stroke: #64748b; }
      .obj { fill: #172554; stroke: #60a5fa; }
      .obj2 { fill: #1e293b; stroke: #94a3b8; }
      .line { stroke: #60a5fa; }
      .line2 { stroke: #94a3b8; }
      .tip { fill: #60a5fa; }
      .tip2 { fill: #94a3b8; }
    }
  </style>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="tip" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="tip2" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <text class="txt sub" x="20" y="28">呼び出し</text>
  <text class="txt sub" x="196" y="28">関数の中</text>
  <text class="txt sub" x="436" y="28">ターミナルの表示</text>
  <text class="txt sub" x="556" y="28">戻り値</text>
  <rect class="var" x="20" y="44" width="130" height="40" rx="6"/>
  <text class="code" x="85" y="69" text-anchor="middle">showDouble(5)</text>
  <path class="line2" d="M150,64 L192,64" marker-end="url(#a2)"/>
  <rect class="var" x="196" y="44" width="190" height="40" rx="8"/>
  <text class="code" x="291" y="69" text-anchor="middle">console.log(n * 2);</text>
  <path class="line2" d="M386,64 L432,64" marker-end="url(#a2)"/>
  <rect class="obj" x="436" y="44" width="100" height="40" rx="6"/>
  <text class="code" x="486" y="69" text-anchor="middle">10</text>
  <rect class="obj2" x="556" y="44" width="94" height="40" rx="6"/>
  <text class="code dim" x="603" y="69" text-anchor="middle">undefined</text>
  <rect class="var" x="20" y="114" width="130" height="40" rx="6"/>
  <text class="code" x="85" y="139" text-anchor="middle">double(5)</text>
  <path class="line2" d="M150,134 L192,134" marker-end="url(#a2)"/>
  <rect class="var" x="196" y="114" width="190" height="40" rx="8"/>
  <text class="code" x="291" y="139" text-anchor="middle">return n * 2;</text>
  <path class="line2" d="M386,134 L432,134" marker-end="url(#a2)"/>
  <rect class="obj2" x="436" y="114" width="100" height="40" rx="6"/>
  <text class="txt sub" x="486" y="139" text-anchor="middle">（なし）</text>
  <rect class="obj" x="556" y="114" width="94" height="40" rx="6"/>
  <text class="code" x="603" y="139" text-anchor="middle">10</text>
  <text class="txt sub" x="20" y="186">console.log は、ターミナルに表示するだけ。</text>
  <text class="txt sub" x="20" y="206">return は、値を呼び出した所に返す。返した値は、変数に入れたり式の中で使ったりできる。</text>
</svg>
