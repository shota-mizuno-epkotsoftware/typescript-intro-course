<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 190" width="620" height="190" role="img" aria-labelledby="t d">
  <title id="t">閉じ忘れた所から下は、文字列の色になる</title>
  <desc id="d">VS Code で try.js の 3 行を開いた画面。1 行目の console.log("1 行目"); は、いつもどおりに色分けされる。2 行目の console.log(`2 行目); は、閉じ忘れた ` から後ろが文字列の色（オレンジがかった茶色）になり、3 行目の console.log("3 行目"); は行全体が同じ文字列の色になる。閉じる ` がないので、2 行目の途中からファイルの終わりまでが 1 つの文字列として読まれる。</desc>
  <style>
    .ui { font-family: -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif; font-size: 13px; fill: #cccccc; }
    .mono { font-family: Menlo, Consolas, "Courier New", monospace; font-size: 12px; fill: #cccccc; }
    .faint { fill: #9d9d9d; }
    .lineno { fill: #6e7681; }
    .k-var { fill: #9cdcfe; }
    .k-fn { fill: #dcdcaa; }
    .k-str { fill: #ce9178; }
    .js { font-family: -apple-system, "Segoe UI", sans-serif; font-size: 9.5px; font-weight: 700; fill: #cbcb41; }
    .frame { fill: #1f1f1f; stroke: #3c3c3c; stroke-width: 1; }
    .bar { fill: #181818; }
    .tab { fill: #1f1f1f; }
    .edge { fill: none; stroke: #2b2b2b; stroke-width: 1; }
    .blue { fill: #0078d4; }
    .mark { fill: none; stroke: #ea580c; stroke-width: 2; }
    .lead { fill: none; stroke: #ea580c; stroke-width: 1.5; }
    .badge { fill: #ea580c; }
    .badge-num { font-family: -apple-system, "Segoe UI", sans-serif; font-size: 12px; font-weight: 700; fill: #ffffff; }
    .note { font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; font-size: 13px; fill: #1f2937; }
    .note-sub { fill: #4b5563; }
    .note-head { font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .mark, .lead { stroke: #fb923c; }
      .badge { fill: #f97316; }
      .note { fill: #e5e7eb; }
      .note-sub { fill: #9ca3af; }
    }
  </style>

  <!-- エディタ（一部を切り出したもの） -->
  <rect class="frame" x="10" y="10" width="380" height="136" rx="6"/>
  <path class="bar" d="M16,10 H384 A6,6 0 0 1 390,16 V46 H10 V16 A6,6 0 0 1 16,10 Z"/>
  <rect class="tab" x="10" y="11" width="120" height="35"/>
  <rect class="blue" x="10" y="11" width="120" height="2"/>
  <text class="js" x="24" y="33">JS</text><text class="ui" x="41" y="34">try.js</text>
  <text class="ui faint" x="112" y="34" text-anchor="middle">×</text>
  <path class="edge" d="M10,46 H390"/>

  <text class="mono lineno" x="30" y="72" text-anchor="end">1</text>
  <text class="mono" x="44" y="72"><tspan class="k-var">console</tspan>.<tspan class="k-fn">log</tspan>(<tspan class="k-str">"1 行目"</tspan>);</text>
  <text class="mono lineno" x="30" y="92" text-anchor="end">2</text>
  <text class="mono" x="44" y="92"><tspan class="k-var">console</tspan>.<tspan class="k-fn">log</tspan>(</text>
  <text class="mono k-str" x="130.7" y="92">`2 行目);</text>
  <text class="mono lineno" x="30" y="112" text-anchor="end">3</text>
  <text class="mono k-str" x="44" y="112">console.log("3 行目");</text>
  <text class="mono lineno" x="30" y="132" text-anchor="end">4</text>

  <!-- 印 -->
  <rect class="mark" x="129" y="78" width="9.5" height="19" rx="3"/>
  <path class="lead" d="M133.75,97 V100 H398"/>
  <circle class="badge" cx="410" cy="100" r="10"/><text class="badge-num" x="410" y="104.5" text-anchor="middle">1</text>
  <text class="note note-head" x="426" y="104.5">ここから下が文字列の色になる</text>

  <text class="note note-sub" x="10" y="176">閉じる ` がないので、2 行目の途中からファイルの終わりまでが 1 つの文字列として読まれる。</text>
</svg>
