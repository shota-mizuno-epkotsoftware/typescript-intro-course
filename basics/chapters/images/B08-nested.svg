<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 272" width="660" height="272" role="img" aria-labelledby="t d">
  <title id="t">入れ子のデータ</title>
  <desc id="d">month は、name が "4月"、budget が 30000、entries が配列のオブジェクト。entries の配列には、記録のオブジェクトが 2 件入っている。0 番は食費の 1200、1 番は交通費の 500。month.entries[0].amount は、month の ① entries、その ② 0 番、その ③ amount と、左から順にたどって 1200 を取り出す。図の中の同じ場所にも ①②③ の番号がある。</desc>
  <style>
    .txt { fill: #1f2937; font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; font-size: 13px; }
    .sub { fill: #4b5563; font-size: 12px; }
    .code { fill: #1f2937; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; }
    .em { fill: #1d4ed8; }
    .var { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
    .obj { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
    .num { font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; font-size: 13px; font-weight: 700; }
    .sep { stroke: #cbd5e1; stroke-width: 1; }
    .line { fill: none; stroke: #2563eb; stroke-width: 1.8; }
    .line2 { fill: none; stroke: #64748b; stroke-width: 1.8; }
    .tip { fill: #2563eb; }
    .tip2 { fill: #64748b; }
    @media (prefers-color-scheme: dark) {
      .txt, .code { fill: #e5e7eb; }
      .sub { fill: #9ca3af; }
      .em { fill: #93c5fd; }
      .var { fill: #1e293b; stroke: #64748b; }
      .obj { fill: #172554; stroke: #60a5fa; }
      .sep { stroke: #475569; }
      .line { stroke: #60a5fa; }
      .line2 { stroke: #94a3b8; }
      .tip { fill: #60a5fa; }
      .tip2 { fill: #94a3b8; }
    }
  </style>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="tip" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="tip2" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <text class="txt sub" x="20" y="24">month（オブジェクト）</text>
  <text class="txt sub" x="262" y="24">entries（配列）</text>
  <rect class="var" x="20" y="36" width="190" height="130" rx="8"/>
  <text class="code" x="36" y="66">name: "4月"</text>
  <text class="code" x="36" y="100">budget: 30000</text>
  <text class="num em" x="34" y="134">①</text>
  <text class="code em" x="52" y="134">entries:</text>
  <path class="line" d="M118,130 L256,130" marker-end="url(#a1)"/>
  <rect class="var" x="260" y="36" width="380" height="130" rx="8"/>
  <rect class="obj" x="274" y="50" width="352" height="44" rx="6"/>
  <text class="num em" x="282" y="77">②</text>
  <text class="code em" x="298" y="77">[0]</text>
  <text class="code" x="326" y="77">{ …, category: "食費", <tspan class="num em">③</tspan> <tspan class="em">amount: 1200</tspan> }</text>
  <rect class="var" x="274" y="108" width="352" height="44" rx="6"/>
  <text class="code" x="298" y="135">[1]</text>
  <text class="code" x="326" y="135">{ …, category: "交通費", amount: 500 }</text>
  <text class="code" x="20" y="206">month<tspan class="em">.entries[0].amount</tspan></text>
  <text class="num em" x="87" y="226" text-anchor="middle">①</text>
  <text class="num em" x="129" y="226" text-anchor="middle">②</text>
  <text class="num em" x="170" y="226" text-anchor="middle">③</text>
  <path class="line" d="M206,202 L262,202" marker-end="url(#a1)"/>
  <rect class="obj" x="268" y="186" width="80" height="32" rx="6"/>
  <text class="code em" x="308" y="207" text-anchor="middle">1200</text>
  <text class="txt sub" x="20" y="258">month の ① entries、その ② 0 番の記録、その ③ amount と、左から順にたどる。</text>
</svg>
