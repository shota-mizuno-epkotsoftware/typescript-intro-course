<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 240" width="660" height="240" role="img" aria-labelledby="t d">
  <title id="t">読み込んだときに実行される行と、クリックで実行される行</title>
  <desc id="d">ページを開いたときは、1〜5 行目、6 行目、11 行目の順に 1 回だけ実行され、コンソールに A と C が出る。6 行目は関数を登録するだけで、関数の中は実行しない。その後、ボタンを押すたびに、6 行目で登録した関数の中の 7〜9 行目が実行され、コンソールに B が出て、画面の文字が変わる。</desc>
  <style>
    .txt { fill: #1f2937; font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; font-size: 13px; }
    .sub { fill: #4b5563; font-size: 12px; }
    .head { font-weight: 700; }
    .code { fill: #1f2937; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; }
    .small { font-size: 11.5px; }
    .hl { fill: #2563eb; }
    .var { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
    .obj { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
    .obj2 { fill: none; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 5 3; }
    .win { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
    .bar { fill: #eef1f5; stroke: #94a3b8; stroke-width: 1.5; }
    .rule { fill: none; stroke: #cbd5e1; stroke-width: 1; }
    .dot { fill: #cbd5e1; }
    .line { fill: none; stroke: #2563eb; stroke-width: 1.8; }
    .line2 { fill: none; stroke: #64748b; stroke-width: 1.8; }
    .reg { fill: none; stroke: #94a3b8; stroke-width: 1; }
    .tip3 { fill: #94a3b8; }
    .tip { fill: #2563eb; }
    .tip2 { fill: #64748b; }
    @media (prefers-color-scheme: dark) {
      .txt, .code { fill: #e5e7eb; }
      .sub { fill: #9ca3af; }
      .hl { fill: #60a5fa; }
      .var { fill: #1e293b; stroke: #64748b; }
      .obj { fill: #172554; stroke: #60a5fa; }
      .obj2 { stroke: #64748b; }
      .win { fill: #0f1419; stroke: #64748b; }
      .bar { fill: #1e293b; stroke: #64748b; }
      .rule { stroke: #334155; }
      .dot { fill: #475569; }
      .line { stroke: #60a5fa; }
      .line2 { stroke: #94a3b8; }
      .tip { fill: #60a5fa; }
      .tip2 { fill: #94a3b8; }
      .reg { stroke: #64748b; }
      .tip3 { fill: #64748b; }
    }
  </style>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="tip" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="tip2" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="tip3" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <text class="txt sub" x="20" y="24">ページを開いたとき（上から順に、1 回だけ）</text>
  <rect class="var" x="20" y="36" width="180" height="52" rx="6"/>
  <text class="txt" x="110" y="58" text-anchor="middle">1〜5 行目</text>
  <text class="txt sub" x="110" y="78" text-anchor="middle">コンソールに A</text>
  <path class="line2" d="M200,62 L226,62" marker-end="url(#a2)"/>
  <rect class="var" x="230" y="36" width="200" height="52" rx="6"/>
  <text class="txt" x="330" y="58" text-anchor="middle">6 行目：関数を登録する</text>
  <text class="txt sub" x="330" y="78" text-anchor="middle">関数の中は、実行しない</text>
  <path class="line2" d="M430,62 L456,62" marker-end="url(#a2)"/>
  <rect class="var" x="460" y="36" width="180" height="52" rx="6"/>
  <text class="txt" x="550" y="58" text-anchor="middle">11 行目</text>
  <text class="txt sub" x="550" y="78" text-anchor="middle">コンソールに C</text>

  <path class="line2" d="M600,88 L600,146" marker-end="url(#a2)"/>
  <text class="txt sub" x="590" y="114" text-anchor="end">その後、ボタンを</text>
  <text class="txt sub" x="590" y="132" text-anchor="end">押すたびに</text>

  <path class="reg" d="M330,88 L330,176 L376,176" marker-end="url(#a3)"/>
  <text class="txt sub" x="340" y="166">登録</text>

  <rect class="obj" x="380" y="150" width="260" height="52" rx="6"/>
  <text class="txt" x="510" y="172" text-anchor="middle">7〜9 行目：登録した関数の中</text>
  <text class="txt sub" x="510" y="192" text-anchor="middle">コンソールに B、画面の文字が変わる</text>

  <text class="txt sub" x="20" y="230">登録した関数の中は、ボタンが押されるまで実行されない。</text>
</svg>
