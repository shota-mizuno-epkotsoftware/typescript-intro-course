<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 150" width="660" height="150" role="img" aria-labelledby="t d">
  <title id="t">テンプレート文字列は、${ } の中だけを計算する</title>
  <desc id="d">テンプレート文字列 `合計: ${120 + 80}円` では、${120 + 80} の部分だけが計算されて 200 になり、その結果が文字列に入る。表示は「合計: 200円」になる。${ } の外は、書いたとおりに表示される。</desc>
  <style>
    .txt { fill: #1f2937; font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; font-size: 13px; }
    .sub { fill: #4b5563; font-size: 12px; }
    .head { font-weight: 700; }
    .acc { fill: #2563eb; }
    .code { fill: #1f2937; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; }
    .dim { fill: #6b7280; }
    .var { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
    .obj { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
    .obj2 { fill: none; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 5 3; }
    .pane { fill: none; stroke: #94a3b8; stroke-width: 1; }
    .line { fill: none; stroke: #2563eb; stroke-width: 1.6; }
    .line2 { fill: none; stroke: #64748b; stroke-width: 1.6; }
    .tip { fill: #2563eb; }
    .tip2 { fill: #64748b; }
    .dot { fill: #94a3b8; }
    @media (prefers-color-scheme: dark) {
      .txt, .code { fill: #e5e7eb; }
      .sub { fill: #9ca3af; }
      .acc { fill: #60a5fa; }
      .dim { fill: #9ca3af; }
      .var { fill: #1e293b; stroke: #64748b; }
      .obj { fill: #172554; stroke: #60a5fa; }
      .obj2 { stroke: #64748b; }
      .pane { stroke: #64748b; }
      .line { stroke: #60a5fa; }
      .line2 { stroke: #94a3b8; }
      .tip { fill: #60a5fa; }
      .tip2 { fill: #94a3b8; }
      .dot { fill: #64748b; }
    }
  </style>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="tip" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="tip2" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <text class="txt sub" x="30" y="40">書いたもの</text>
  <text class="code" x="233" y="40" text-anchor="end">`合計: </text>
  <rect class="obj" x="235" y="22" width="90" height="28" rx="6"/>
  <text class="code" x="280" y="40" text-anchor="middle">${120 + 80}</text>
  <text class="code" x="327" y="40">円`</text>
  <path class="line" d="M280,52 L280,84" marker-end="url(#a1)"/>
  <text class="txt sub" x="292" y="72">計算した結果が入る</text>
  <text class="txt sub" x="30" y="106">表示</text>
  <text class="code" x="262" y="106" text-anchor="end">合計: </text>
  <rect class="obj" x="264" y="88" width="32" height="28" rx="6"/>
  <text class="code" x="280" y="106" text-anchor="middle">200</text>
  <text class="code" x="298" y="106">円</text>
  <text class="txt sub" x="30" y="140">${ } の中だけが計算される。外は、書いたとおりに表示される。</text>
</svg>
