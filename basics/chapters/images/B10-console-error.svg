<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 262" width="760" height="262" role="img" aria-labelledby="t d">
  <title id="t">コンソールに出たエラーの読む所</title>
  <desc id="d">開発者ツールの Console に、2 行が出ている。1 行目は console.log の表示の null。2 行目は赤いエラーの行で、Uncaught TypeError: Cannot set properties of null (setting 'textContent') と書かれ、その下に at で始まる行が続く。読む所は 3 つある。1 つ目は行の右端の try.js?t=1795730940221:3 で、ファイル名と行番号（try.js の 3 行目）を表す。間の ?t=数字 は読み飛ばす。2 つ目は TypeError から後ろで、エラーの種類と説明を表す。先頭の Uncaught は読み飛ばす。3 つ目は説明の中の of null で、. の左が null だという意味。at で始まる行は読まない。</desc>
  <!-- 開発者ツールの Console の部分を切り出した図（実物の大きさ）。タブの行 26、ツールバー 26、メッセージの行 20 -->
  <style>
    .dt { font-family: -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif; font-size: 12px; fill: #1f1f1f; }
    .gray { fill: #5f6368; }
    .mono { font-family: Menlo, Consolas, "Courier New", monospace; font-size: 11px; fill: #1f1f1f; }
    .null { fill: #80868b; }
    .link { fill: #474747; text-decoration: underline; }
    .err { fill: #b3261e; }
    .frame { fill: #ffffff; stroke: #c4c7c5; stroke-width: 1; }
    .dev { fill: #f8f9fa; }
    .errbg { fill: #fcebeb; }
    .erredge { fill: none; stroke: #f6c8c4; stroke-width: 1; }
    .erricon { fill: #dc362e; }
    .errx { fill: none; stroke: #ffffff; stroke-width: 1.4; }
    .edge { fill: none; stroke: #dadce0; stroke-width: 1; }
    .icon { fill: none; stroke: #5f6368; stroke-width: 1.3; }
    .filter { fill: #ffffff; stroke: #dadce0; stroke-width: 1; }
    .blue { fill: #1a73e8; }
    .mark { fill: none; stroke: #ea580c; stroke-width: 2; }
    .badge { fill: #ea580c; }
    .badge-num { font-family: -apple-system, "Segoe UI", sans-serif; font-size: 11px; font-weight: 700; fill: #ffffff; }
    .note { font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; font-size: 13px; fill: #1f2937; }
    .note-head { font-weight: 700; }
    .note-sub { fill: #4b5563; }
    @media (prefers-color-scheme: dark) {
      .mark { stroke: #fb923c; }
      .badge { fill: #f97316; }
      .note { fill: #e5e7eb; }
      .note-sub { fill: #9ca3af; }
    }
  </style>

  <!-- 開発者ツールの枠、タブの行、ツールバー -->
  <rect class="frame" x="10" y="10" width="740" height="140" rx="4"/>
  <path class="dev" d="M14,10.5 H746 A3.5,3.5 0 0 1 749.5,14 V36 H10.5 V14 A3.5,3.5 0 0 1 14,10.5 Z"/>
  <path class="edge" d="M10.5,36.5 H749.5"/>
  <text class="dt gray" x="22" y="28">Elements</text>
  <text class="dt" x="91" y="28">Console</text>
  <rect class="blue" x="87" y="34" width="53" height="2.5"/>
  <text class="dt gray" x="154" y="28">Sources</text>
  <text class="dt gray" x="213" y="28">Network</text>
  <text class="dt gray" x="274" y="28">≫</text>
  <circle class="icon" cx="24" cy="49.5" r="5.5"/><path class="icon" d="M20.2,53.3 L27.8,45.7"/>
  <text class="dt" x="40" y="54">top ▾</text>
  <rect class="filter" x="90" y="41" width="150" height="17" rx="2"/>
  <text class="dt gray" x="97" y="54">Filter</text>
  <path class="edge" d="M10.5,62.5 H749.5"/>

  <!-- console.log の表示の行 -->
  <text class="mono null" x="34" y="76.5">null</text>
  <text class="mono link" x="742" y="76.5" text-anchor="end">try.js?t=1795730940221:2</text>

  <!-- エラーの行 -->
  <rect class="errbg" x="10.5" y="82.5" width="739" height="38"/>
  <path class="erredge" d="M10.5,82.5 H749.5 M10.5,120.5 H749.5"/>
  <circle class="erricon" cx="22" cy="95.5" r="5.5"/><path class="errx" d="M19.8,93.3 L24.2,97.7 M24.2,93.3 L19.8,97.7"/>
  <text class="mono err" x="34" y="99.5">Uncaught TypeError: Cannot set properties of null (setting 'textContent')</text>
  <text class="mono link" x="742" y="99.5" text-anchor="end">try.js?t=1795730940221:3</text>
  <text class="mono err" x="60.5" y="114.5">at <tspan class="link">try.js?t=1795730940221:3:21</tspan></text>
  <text class="dt blue" x="20" y="139">›</text>

  <!-- 印 -->
  <rect class="mark" x="579" y="87" width="167" height="17" rx="3"/>
  <circle class="badge" cx="567" cy="95.5" r="8"/><text class="badge-num" x="567" y="99.5" text-anchor="middle">1</text>
  <rect class="mark" x="90" y="87" width="431" height="17" rx="3"/>
  <circle class="badge" cx="533" cy="95.5" r="8"/><text class="badge-num" x="533" y="99.5" text-anchor="middle">2</text>
  <path class="mark" d="M313,107 V110.5 H357 V107"/>
  <circle class="badge" cx="370" cy="113" r="8"/><text class="badge-num" x="370" y="117" text-anchor="middle">3</text>

  <!-- 下の説明 -->
  <circle class="badge" cx="19" cy="173" r="9"/><text class="badge-num" x="19" y="177" text-anchor="middle">1</text>
  <text class="note" x="36" y="178"><tspan class="note-head">ファイル名と行番号（try.js の 3 行目）</tspan><tspan class="note-sub" dx="10">間の「?t=数字」は読み飛ばす</tspan></text>
  <circle class="badge" cx="19" cy="198" r="9"/><text class="badge-num" x="19" y="202" text-anchor="middle">2</text>
  <text class="note" x="36" y="203"><tspan class="note-head">エラーの種類と説明</tspan><tspan class="note-sub" dx="10">先頭の Uncaught は読み飛ばす</tspan></text>
  <circle class="badge" cx="19" cy="223" r="9"/><text class="badge-num" x="19" y="227" text-anchor="middle">3</text>
  <text class="note" x="36" y="228"><tspan class="note-head">of null</tspan><tspan class="note-sub" dx="10">「. の左が null」という意味</tspan></text>
  <text class="note note-sub" x="10" y="252">at で始まる行は読まない。</text>
</svg>
