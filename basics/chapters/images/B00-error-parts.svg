<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 206" width="720" height="206" role="img" aria-labelledby="t d">
  <title id="t">エラーの表示の読み方</title>
  <desc id="d">エラーの表示には、読む所が 3 つある。1 つ目は最初の行の末尾の problem-01.js:2 で、エラーの場所（2 行目）を表す。2 つ目はその下の ^ の印で、その行のどこがおかしいかを表す。3 つ目は SyntaxError: Invalid or unexpected token の行で、エラーの種類と説明を表す。at で始まる行は読まなくてよい。</desc>
  <style>
    .ui { font-family: -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif; font-size: 11px; fill: #9d9d9d; }
    .on { fill: #e7e7e7; }
    .mono { font-family: Menlo, Consolas, "Courier New", monospace; font-size: 12px; fill: #cccccc; }
    .dim { fill: #8b8b8b; }
    .frame { fill: #181818; stroke: #3c3c3c; stroke-width: 1; }
    .edge { fill: none; stroke: #2b2b2b; stroke-width: 1; }
    .blue { fill: #0078d4; }
    .mark { fill: none; stroke: #ea580c; stroke-width: 2; }
    .lead { fill: none; stroke: #ea580c; stroke-width: 1.5; }
    .badge { fill: #ea580c; }
    .badge-num { font-family: -apple-system, "Segoe UI", sans-serif; font-size: 12px; font-weight: 700; fill: #ffffff; }
    .note { font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; font-size: 13px; fill: #1f2937; }
    .note-head { font-weight: 700; }
    .note-sub { fill: #4b5563; }
    @media (prefers-color-scheme: dark) {
      .mark, .lead { stroke: #fb923c; }
      .badge { fill: #f97316; }
      .note { fill: #e5e7eb; }
      .note-sub { fill: #9ca3af; }
    }
  </style>

  <!-- ターミナル -->
  <rect class="frame" x="10" y="10" width="500" height="160" rx="6"/>
  <text class="ui" x="24" y="31">問題</text>
  <text class="ui" x="58" y="31">出力</text>
  <text class="ui on" x="92" y="31">ターミナル</text>
  <rect class="blue" x="90" y="37" width="56" height="1.5"/>
  <path class="edge" d="M10,44 H510"/>
  <text class="mono" x="22" y="66">file:///（省略）/basics/exercises/B00-setup/problem-01.js:2</text>
  <text class="mono" x="22" y="83">console.log("2 行目);</text>
  <text class="mono" x="113" y="100">^^^^^^^</text>
  <text class="mono" x="22" y="134">SyntaxError: Invalid or unexpected token</text>
  <text class="mono dim" x="22" y="151">    at compileSourceTextModule (…)</text>

  <!-- 印 -->
  <rect class="mark" x="327" y="52" width="115" height="19" rx="4"/>
  <rect class="mark" x="108" y="88" width="58" height="17" rx="4"/>
  <rect class="mark" x="17" y="120" width="300" height="19" rx="4"/>

  <!-- 引き出し線と説明 -->
  <path class="lead" d="M442,61.5 H528"/>
  <path class="lead" d="M166,96.5 H528"/>
  <path class="lead" d="M317,129.5 H528"/>
  <circle class="badge" cx="540" cy="61.5" r="10"/><text class="badge-num" x="540" y="66" text-anchor="middle">1</text>
  <circle class="badge" cx="540" cy="96.5" r="10"/><text class="badge-num" x="540" y="101" text-anchor="middle">2</text>
  <circle class="badge" cx="540" cy="129.5" r="10"/><text class="badge-num" x="540" y="134" text-anchor="middle">3</text>
  <text class="note note-head" x="556" y="66.5">場所（2 行目）</text>
  <text class="note note-head" x="556" y="101.5">印（その行のどこか）</text>
  <text class="note note-head" x="556" y="134.5">種類と説明</text>
  <text class="note note-sub" x="540" y="158">at の行は読まない</text>

  <text class="note note-sub" x="10" y="196">まず ① で何行目かを見て、その行を見直す。</text>
</svg>
