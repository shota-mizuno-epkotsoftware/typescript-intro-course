<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 246" width="660" height="246" role="img" aria-labelledby="t d">
  <title id="t">return で関数は終わる</title>
  <desc id="d">shippingFee(5000) を呼んだときは、2 行目の条件 amount >= 3000 が true なので、3 行目の return 0; が実行され、0 を返して関数が終わる。5 行目の return 500; には進まない。shippingFee(1200) を呼んだときは、条件が false なので、3 行目の return 0; は実行されず、5 行目の return 500; が実行され、500 を返して関数が終わる。</desc>
  <style>
    .txt { fill: #1f2937; font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; font-size: 13px; }
    .sub { fill: #4b5563; font-size: 12px; }
    .head { font-weight: 700; }
    .code { fill: #1f2937; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; }
    .dim { fill: #6b7280; }
    .em { fill: #1d4ed8; }
    .var { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
    .obj { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
    .obj2 { fill: #f8fafc; stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 5 3; }
    .area { fill: none; stroke: #cbd5e1; stroke-width: 1.2; }
    .line { fill: none; stroke: #2563eb; stroke-width: 1.8; }
    .line2 { fill: none; stroke: #64748b; stroke-width: 1.8; }
    .tip { fill: #2563eb; }
    .tip2 { fill: #64748b; }
    @media (prefers-color-scheme: dark) {
      .txt, .code { fill: #e5e7eb; }
      .sub, .dim { fill: #9ca3af; }
      .em { fill: #93c5fd; }
      .var { fill: #1e293b; stroke: #64748b; }
      .obj { fill: #172554; stroke: #60a5fa; }
      .obj2 { fill: #1e293b; stroke: #94a3b8; }
      .area { stroke: #475569; }
      .line { stroke: #60a5fa; }
      .line2 { stroke: #94a3b8; }
      .tip { fill: #60a5fa; }
      .tip2 { fill: #94a3b8; }
    }
  </style>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="tip" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="tip2" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <text class="txt sub" x="14" y="30"><tspan class="code">shippingFee(5000)</tspan> を呼んだとき</text>
  <rect class="area" x="10" y="42" width="315" height="168" rx="10"/>
  <text class="code dim" x="36" y="68" text-anchor="end">1</text>
  <text class="code dim" x="36" y="94" text-anchor="end">2</text>
  <text class="code dim" x="36" y="120" text-anchor="end">3</text>
  <text class="code dim" x="36" y="146" text-anchor="end">4</text>
  <text class="code dim" x="36" y="172" text-anchor="end">5</text>
  <text class="code dim" x="36" y="198" text-anchor="end">6</text>
  <text class="code" x="48" y="68">function shippingFee(amount) {</text>
  <text class="code" x="63" y="94">if (amount &gt;= 3000) {</text>
  <text class="code head" x="236" y="94">true</text>
  <rect class="obj" x="70" y="102" width="104" height="27" rx="6"/>
  <text class="code" x="78" y="120">return 0;</text>
  <text class="txt sub em" x="186" y="120">0 を返して終わる</text>
  <rect class="obj2" x="55" y="154" width="104" height="27" rx="6"/>
  <text class="code dim" x="63" y="172">return 500;</text>
  <text class="txt sub" x="186" y="172">ここには進まない</text>
  <text class="code" x="63" y="146">}</text>
  <text class="code" x="48" y="198">}</text>
  <text class="txt sub" x="339" y="30"><tspan class="code">shippingFee(1200)</tspan> を呼んだとき</text>
  <rect class="area" x="335" y="42" width="315" height="168" rx="10"/>
  <text class="code dim" x="361" y="68" text-anchor="end">1</text>
  <text class="code dim" x="361" y="94" text-anchor="end">2</text>
  <text class="code dim" x="361" y="120" text-anchor="end">3</text>
  <text class="code dim" x="361" y="146" text-anchor="end">4</text>
  <text class="code dim" x="361" y="172" text-anchor="end">5</text>
  <text class="code dim" x="361" y="198" text-anchor="end">6</text>
  <text class="code" x="373" y="68">function shippingFee(amount) {</text>
  <text class="code" x="388" y="94">if (amount &gt;= 3000) {</text>
  <text class="code head" x="561" y="94">false</text>
  <rect class="obj2" x="395" y="102" width="104" height="27" rx="6"/>
  <text class="code dim" x="403" y="120">return 0;</text>
  <text class="txt sub" x="511" y="120">実行されない</text>
  <rect class="obj" x="380" y="154" width="104" height="27" rx="6"/>
  <text class="code" x="388" y="172">return 500;</text>
  <text class="txt sub em" x="511" y="172">500 を返して終わる</text>
  <text class="code" x="388" y="146">}</text>
  <text class="code" x="373" y="198">}</text>
  <text class="txt sub" x="10" y="234">return を実行すると、関数はそこで終わる。その下の行には進まない。</text>
</svg>
