<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 176" width="720" height="176" role="img" aria-labelledby="t d">
  <title id="t">保存していないファイルの印</title>
  <desc id="d">ファイルを書き換えると、画面の上のファイル名 hello.js の横に ● が付く。保存すると ● が消える。</desc>
  <style>
    .ui { font-family: -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif; font-size: 13px; fill: #cccccc; }
    .mono { font-family: Menlo, Consolas, "Courier New", monospace; font-size: 12px; fill: #cccccc; }
    .faint { fill: #9d9d9d; }
    .lineno { fill: #6e7681; }
    .k-var { fill: #9cdcfe; }
    .k-fn { fill: #dcdcaa; }
    .k-str { fill: #ce9178; }
    .js { font-family: -apple-system, "Segoe UI", sans-serif; font-size: 9.5px; font-weight: 700; fill: #cbcb41; }
    .frame { fill: #1f1f1f; stroke: #3c3c3c; stroke-width: 1; }
    .bar { fill: #181818; }
    .tab { fill: #1f1f1f; }
    .edge { fill: none; stroke: #2b2b2b; stroke-width: 1; }
    .blue { fill: #0078d4; }
    .dot { fill: #cccccc; }
    .mark { fill: none; stroke: #ea580c; stroke-width: 2; }
    .note { font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; font-size: 13px; fill: #1f2937; }
    .note-sub { fill: #4b5563; }
    .note-head { font-weight: 700; }
    .line { fill: none; stroke: #64748b; stroke-width: 1.6; }
    .tip { fill: #64748b; }
    @media (prefers-color-scheme: dark) {
      .mark { stroke: #fb923c; }
      .note { fill: #e5e7eb; }
      .note-sub { fill: #9ca3af; }
      .line { stroke: #94a3b8; }
      .tip { fill: #94a3b8; }
    }
  </style>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="tip" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <text class="note note-head" x="10" y="20">書き換えた後（保存していない）</text>
  <text class="note note-head" x="430" y="20">保存した後</text>

  <!-- 左：保存していない -->
  <rect class="frame" x="10" y="32" width="280" height="96" rx="6"/>
  <path class="bar" d="M16,32 H284 A6,6 0 0 1 290,38 V68 H10 V38 A6,6 0 0 1 16,32 Z"/>
  <rect class="tab" x="10" y="33" width="140" height="35"/>
  <rect class="blue" x="10" y="33" width="140" height="2"/>
  <text class="js" x="24" y="55">JS</text><text class="ui" x="41" y="56">hello.js</text>
  <circle class="dot" cx="130" cy="51" r="4.5"/>
  <circle class="mark" cx="130" cy="51" r="11"/>
  <path class="edge" d="M10,68 H290"/>
  <text class="mono" x="30" y="94" text-anchor="end">1</text>
  <text class="mono" x="44" y="94"><tspan class="k-var">console</tspan>.<tspan class="k-fn">log</tspan>(<tspan class="k-str">"こんにちは"</tspan>);</text>
  <text class="mono lineno" x="30" y="114" text-anchor="end">2</text>

  <!-- 矢印 -->
  <path class="line" d="M302,80 L416,80" marker-end="url(#a1)"/>
  <text class="note note-sub" x="359" y="68" text-anchor="middle">保存する</text>
  <text class="note note-sub" x="359" y="102" text-anchor="middle">Ctrl + S</text>
  <text class="note note-sub" x="359" y="120" text-anchor="middle">（Cmd + S）</text>

  <!-- 右：保存した後 -->
  <rect class="frame" x="430" y="32" width="280" height="96" rx="6"/>
  <path class="bar" d="M436,32 H704 A6,6 0 0 1 710,38 V68 H430 V38 A6,6 0 0 1 436,32 Z"/>
  <rect class="tab" x="430" y="33" width="140" height="35"/>
  <rect class="blue" x="430" y="33" width="140" height="2"/>
  <text class="js" x="444" y="55">JS</text><text class="ui" x="461" y="56">hello.js</text>
  <text class="ui faint" x="550" y="56" text-anchor="middle">×</text>
  <path class="edge" d="M430,68 H710"/>
  <text class="mono" x="450" y="94" text-anchor="end">1</text>
  <text class="mono" x="464" y="94"><tspan class="k-var">console</tspan>.<tspan class="k-fn">log</tspan>(<tspan class="k-str">"こんにちは"</tspan>);</text>
  <text class="mono lineno" x="450" y="114" text-anchor="end">2</text>

  <text class="note note-sub" x="10" y="160">● が付いている間は、書き換えた内容が実行に使われない。</text>
</svg>
