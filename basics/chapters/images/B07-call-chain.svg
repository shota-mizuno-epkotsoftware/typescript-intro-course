<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 250" width="660" height="250" role="img" aria-labelledby="t d">
  <title id="t">関数から関数を呼ぶ</title>
  <desc id="d">payment(1200, 2) の中から subtotal(1200, 2) を呼ぶと、戻り値の 2400 が戻ってくる。次に shippingFee(2400) を呼ぶと、戻り値の 500 が戻ってくる。payment の戻り値は、2400 と 500 を足した 2900 になる。</desc>
  <style>
    .txt { fill: #1f2937; font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; font-size: 13px; }
    .sub { fill: #4b5563; font-size: 12px; }
    .code { fill: #1f2937; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; }
    .em { fill: #1d4ed8; }
    .var { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
    .obj { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
    .sep { stroke: #cbd5e1; stroke-width: 1; }
    .line { fill: none; stroke: #2563eb; stroke-width: 1.8; }
    .line2 { fill: none; stroke: #64748b; stroke-width: 1.8; }
    .tip { fill: #2563eb; }
    .tip2 { fill: #64748b; }
    @media (prefers-color-scheme: dark) {
      .txt, .code { fill: #e5e7eb; }
      .sub { fill: #9ca3af; }
      .em { fill: #93c5fd; }
      .var { fill: #1e293b; stroke: #64748b; }
      .obj { fill: #172554; stroke: #60a5fa; }
      .sep { stroke: #475569; }
      .line { stroke: #60a5fa; }
      .line2 { stroke: #94a3b8; }
      .tip { fill: #60a5fa; }
      .tip2 { fill: #94a3b8; }
    }
  </style>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="tip" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="tip2" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <text class="txt sub" x="20" y="24">payment(1200, 2) の中</text>
  <text class="txt sub" x="450" y="24">呼ばれる関数</text>
  <rect class="var" x="20" y="40" width="314" height="170" rx="8"/>
  <text class="code" x="32" y="84">const amount = subtotal(price, count);</text>
  <text class="code" x="32" y="164">return amount + shippingFee(amount);</text>
  <rect class="var" x="450" y="54" width="190" height="50" rx="8"/>
  <text class="code" x="545" y="84" text-anchor="middle">subtotal(1200, 2)</text>
  <rect class="var" x="450" y="134" width="190" height="50" rx="8"/>
  <text class="code" x="545" y="164" text-anchor="middle">shippingFee(2400)</text>
  <path class="line2" d="M334,70 L446,70" marker-end="url(#a2)"/>
  <path class="line" d="M450,90 L338,90" marker-end="url(#a1)"/>
  <text class="txt sub" x="392" y="63" text-anchor="middle">呼ぶ</text>
  <text class="txt em" x="392" y="108" text-anchor="middle">戻り値 2400</text>
  <path class="line2" d="M334,150 L446,150" marker-end="url(#a2)"/>
  <path class="line" d="M450,170 L338,170" marker-end="url(#a1)"/>
  <text class="txt sub" x="392" y="143" text-anchor="middle">呼ぶ</text>
  <text class="txt em" x="392" y="188" text-anchor="middle">戻り値 500</text>
  <text class="txt sub" x="20" y="236">呼び出しは、戻り値に置き換わる。payment(1200, 2) の戻り値は、2400 + 500 で 2900。</text>
</svg>
