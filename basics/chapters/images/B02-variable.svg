<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 142" width="660" height="142" role="img" aria-labelledby="t d">
  <title id="t">変数は、名前の付いた入れ物</title>
  <desc id="d">const price = 120; と書くと、price という名前の付いた入れ物（変数）に、値の 120 が入る。price * 3 と書いた所は、120 * 3 に置き換わって計算され、360 になる。</desc>
  <style>
    .txt { fill: #1f2937; font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; font-size: 13px; }
    .sub { fill: #4b5563; font-size: 12px; }
    .head { font-weight: 700; }
    .acc { fill: #2563eb; }
    .code { fill: #1f2937; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; }
    .dim { fill: #6b7280; }
    .var { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
    .obj { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.5; }
    .obj2 { fill: none; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 5 3; }
    .pane { fill: none; stroke: #94a3b8; stroke-width: 1; }
    .line { fill: none; stroke: #2563eb; stroke-width: 1.6; }
    .line2 { fill: none; stroke: #64748b; stroke-width: 1.6; }
    .tip { fill: #2563eb; }
    .tip2 { fill: #64748b; }
    .dot { fill: #94a3b8; }
    @media (prefers-color-scheme: dark) {
      .txt, .code { fill: #e5e7eb; }
      .sub { fill: #9ca3af; }
      .acc { fill: #60a5fa; }
      .dim { fill: #9ca3af; }
      .var { fill: #1e293b; stroke: #64748b; }
      .obj { fill: #172554; stroke: #60a5fa; }
      .obj2 { stroke: #64748b; }
      .pane { stroke: #64748b; }
      .line { stroke: #60a5fa; }
      .line2 { stroke: #94a3b8; }
      .tip { fill: #60a5fa; }
      .tip2 { fill: #94a3b8; }
      .dot { fill: #64748b; }
    }
  </style>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="tip" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="tip2" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <text class="code" x="30" y="30">const price = 120;</text>
  <text class="txt sub" x="30" y="60">名前</text>
  <text class="code head" x="64" y="60">price</text>
  <rect class="obj" x="30" y="68" width="110" height="40" rx="8"/>
  <text class="code" x="85" y="93" text-anchor="middle">120</text>
  <text class="txt sub" x="150" y="93">値</text>
  <text class="txt sub" x="30" y="130">変数（名前の付いた入れ物）</text>
  <path class="pane" d="M250,20 L250,128"/>
  <text class="txt sub" x="280" y="30">名前を書いた所は、値に置き換わる</text>
  <rect class="var" x="280" y="68" width="104" height="40" rx="8"/>
  <text class="code" x="332" y="93" text-anchor="middle">price * 3</text>
  <path class="line" d="M388,88 L424,88" marker-end="url(#a1)"/>
  <rect class="var" x="428" y="68" width="96" height="40" rx="8"/>
  <text class="code" x="476" y="93" text-anchor="middle">120 * 3</text>
  <path class="line2" d="M528,88 L564,88" marker-end="url(#a2)"/>
  <rect class="var" x="568" y="68" width="62" height="40" rx="8"/>
  <text class="code" x="599" y="93" text-anchor="middle">360</text>
</svg>
