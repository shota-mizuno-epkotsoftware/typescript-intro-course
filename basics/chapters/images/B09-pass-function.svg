<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 262" width="720" height="262" role="img" aria-labelledby="t d">
  <title id="t">関数を渡すときと、呼んだ結果を渡すとき</title>
  <desc id="d">上の段は apply(double, 5) で、関数 double そのものが apply の引数 fn に入る。apply の中の fn(value) で double(5) が呼ばれ、10 が返る。下の段は apply(double(), 5) で、先にその場で double() が呼ばれ、その結果の NaN が fn に入る。apply の中の fn(value) で NaN を呼ぼうとして、TypeError: fn is not a function になる。</desc>
  <style>
    .txt { fill: #1f2937; font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; font-size: 13px; }
    .sub { fill: #4b5563; font-size: 12px; }
    .head { font-weight: 700; }
    .code { fill: #1f2937; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; }
    .small { font-size: 12px; }
    .hl { fill: #2563eb; font-weight: 700; }
    .var { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
    .line2 { fill: none; stroke: #64748b; stroke-width: 1.8; }
    .tip2 { fill: #64748b; }
    .chk-fill { fill: #fff7ed; stroke: #c2410c; stroke-width: 1.5; }
    .chk-txt { fill: #c2410c; }
    @media (prefers-color-scheme: dark) {
      .txt, .code { fill: #e5e7eb; }
      .sub { fill: #9ca3af; }
      .hl { fill: #60a5fa; }
      .var { fill: #1e293b; stroke: #64748b; }
      .line2 { stroke: #94a3b8; }
      .tip2 { fill: #94a3b8; }
      .chk-fill { fill: #431407; stroke: #fb923c; }
      .chk-txt { fill: #fdba74; }
    }
  </style>
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="tip2" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <!-- 列の見出し -->
  <text class="txt sub" x="20" y="22">呼び出し</text>
  <text class="txt sub" x="190" y="22">fn に入るもの</text>
  <text class="txt sub" x="330" y="22">apply の中</text>
  <text class="txt sub" x="456" y="22">結果</text>

  <!-- 上の段：関数を渡す -->
  <text class="txt head" x="20" y="48">関数そのものを渡す</text>
  <rect class="var" x="14" y="58" width="150" height="40" rx="6"/>
  <text class="code" x="90" y="82" text-anchor="middle">apply(<tspan class="hl">double</tspan>, 5)</text>
  <path class="line2" d="M164,78 L186,78" marker-end="url(#a2)"/>
  <rect class="var" x="190" y="58" width="110" height="40" rx="6"/>
  <text class="code" x="245" y="82" text-anchor="middle">(n) =&gt; n * 2</text>
  <text class="txt sub" x="245" y="116" text-anchor="middle">関数そのもの</text>
  <path class="line2" d="M300,78 L326,78" marker-end="url(#a2)"/>
  <rect class="var" x="330" y="58" width="96" height="40" rx="6"/>
  <text class="code" x="378" y="82" text-anchor="middle">fn(value)</text>
  <text class="txt sub" x="378" y="116" text-anchor="middle">double(5) を呼ぶ</text>
  <path class="line2" d="M426,78 L452,78" marker-end="url(#a2)"/>
  <rect class="var" x="456" y="58" width="96" height="40" rx="6"/>
  <text class="code" x="504" y="82" text-anchor="middle">10</text>
  <text class="txt sub" x="504" y="116" text-anchor="middle">10 が返る</text>

  <!-- 下の段：呼んだ結果を渡す -->
  <text class="txt head" x="20" y="152">呼んだ結果を渡す</text>
  <rect class="var" x="14" y="162" width="150" height="40" rx="6"/>
  <text class="code" x="90" y="186" text-anchor="middle">apply(double<tspan class="hl">()</tspan>, 5)</text>
  <text class="txt sub" x="90" y="220" text-anchor="middle">先に double() を呼ぶ</text>
  <path class="line2" d="M164,182 L186,182" marker-end="url(#a2)"/>
  <rect class="var" x="190" y="162" width="110" height="40" rx="6"/>
  <text class="code" x="245" y="186" text-anchor="middle">NaN</text>
  <text class="txt sub" x="245" y="220" text-anchor="middle">double() の結果</text>
  <text class="txt sub" x="245" y="236" text-anchor="middle">（n が undefined なので）</text>
  <path class="line2" d="M300,182 L326,182" marker-end="url(#a2)"/>
  <rect class="var" x="330" y="162" width="96" height="40" rx="6"/>
  <text class="code" x="378" y="186" text-anchor="middle">fn(value)</text>
  <text class="txt sub" x="378" y="220" text-anchor="middle">NaN を呼ぼうとする</text>
  <path class="line2" d="M426,182 L452,182" marker-end="url(#a2)"/>
  <rect class="chk-fill" x="456" y="162" width="250" height="40" rx="6"/>
  <text class="code small chk-txt" x="581" y="186" text-anchor="middle">TypeError: fn is not a function</text>
  <text class="txt sub chk-txt" x="581" y="220" text-anchor="middle">関数ではないので呼べない</text>

  <text class="txt sub" x="20" y="252">関数を渡すときは、名前だけを書く。( ) を付けると、その場で呼んだ結果が渡る。</text>
</svg>
