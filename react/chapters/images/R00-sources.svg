<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 393" width="890" height="393" role="img" aria-labelledby="t d">
  <title id="t">集計に足す「入金元ごとの収入」</title>
  <desc id="d">集計の区画を、直す前と直した後で並べた図。直す前は、収入・支出・収支と「分類ごとの支出」だけ。直した後は、その下に「入金元ごとの収入」の見出しと、「給料: 200,000円」「副業: 30,000円」の 2 行が増える。</desc>
  <style>
    .pg { font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif; font-size: 12.8px; fill: #1f2328; }
    .h1 { font-size: 20.5px; font-weight: 700; }
    .h2 { font-size: 14px; font-weight: 700; }
    .h3 { font-size: 12.2px; font-weight: 700; fill: #59636e; }
    .lbl { font-size: 10.9px; fill: #59636e; }
    .ctl { font-size: 10.9px; }
    .small { font-size: 11.5px; }
    .muted { fill: #59636e; }
    .inc { fill: #1a7f37; }
    .exp { fill: #b42318; }
    .panel { fill: #ffffff; stroke: #d8dee4; stroke-width: 0.8; }
    .ctrl { fill: #ffffff; stroke: #d8dee4; stroke-width: 0.8; }
    .btn { fill: #f6f7f9; stroke: #d8dee4; stroke-width: 0.8; }
    .rule { fill: none; stroke: #d8dee4; stroke-width: 0.8; }
    .chev { fill: none; stroke: #1f2328; stroke-width: 1; }
    .check { fill: #0b63ce; }
    .tick { fill: none; stroke: #ffffff; stroke-width: 1.6; }
    .hl { fill: #dbeafe; }
    .con { fill: #ffffff; stroke: #c4c7c5; stroke-width: 1; }
    .con-bar { fill: #eef1f4; }
    .con-err { fill: #fdecea; }
    .con-txt { font-family: Menlo, Consolas, "Courier New", monospace; font-size: 10.5px; fill: #1f2328; }
    .con-red { fill: #b42318; }
    .con-ui { font-family: -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif; font-size: 10.5px; fill: #5f6368; }
    .con-on { fill: #0b57d0; font-weight: 700; }
    .codebox { fill: #f6f8fa; stroke: #d8dee4; stroke-width: 0.8; }
    .code { font-family: Menlo, Consolas, "Courier New", monospace; font-size: 11px; fill: #1f2328; }
    .mark { fill: none; stroke: #ea580c; stroke-width: 1.5; }
    .mark-b { fill: none; stroke: #2563eb; stroke-width: 1.5; }
    .lead { fill: none; stroke: #ea580c; stroke-width: 1; }
    .tag { fill: none; stroke: #ea580c; stroke-width: 1.2; }
    .tag-txt { font-family: Menlo, Consolas, "Courier New", monospace; font-size: 11px; font-weight: 700; fill: #c2410c; }
    .note { font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; font-size: 12px; fill: #1f2937; }
    .cap { font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; font-size: 13px; font-weight: 700; fill: #1f2937; }
    .flow { fill: none; stroke: #6b7280; stroke-width: 1.4; }
    .flow-head { fill: #6b7280; }
    @media (prefers-color-scheme: dark) {
      .mark, .lead, .tag { stroke: #fb923c; }
      .mark-b { stroke: #60a5fa; }
      .tag-txt { fill: #fb923c; }
      .note, .cap { fill: #e5e7eb; }
      .flow { stroke: #9ca3af; }
      .flow-head { fill: #9ca3af; }
    }
  </style>
  <text class="cap" x="10" y="22">直す前</text>
  <text class="cap" x="480" y="22">直した後</text>
  <rect class="panel" x="10" y="34" width="400" height="269" rx="6"/>
  <text class="pg h2" x="26.5" y="64">集計</text>
  <text class="pg lbl" x="26.5" y="93">月</text>
  <rect class="ctrl" x="26.5" y="98" width="76" height="28" rx="4.8"/>
  <text class="pg ctl" x="32.5" y="116">すべて</text>
  <path class="chev" d="M87.5,110 L91.0,113.5 L94.5,110"/>
  <text class="pg lbl" x="115.5" y="93">種別</text>
  <rect class="ctrl" x="115.5" y="98" width="76" height="28" rx="4.8"/>
  <text class="pg ctl" x="121.5" y="116">すべて</text>
  <path class="chev" d="M176.5,110 L180.0,113.5 L183.5,110"/>
  <text class="pg muted" x="26.5" y="155">収入</text>
  <text class="pg" x="90.5" y="155">230,000円</text>
  <text class="pg muted" x="26.5" y="180">支出</text>
  <text class="pg" x="90.5" y="180">2,000円</text>
  <text class="pg muted" x="26.5" y="205">収支</text>
  <text class="pg inc" x="90.5" y="205">228,000円</text>
  <text class="pg h3" x="26.5" y="238">分類ごとの支出</text>
  <text class="pg" x="26.5" y="261">交通費: 1,200円</text>
  <text class="pg" x="26.5" y="283">食費: 800円</text>
  <rect class="panel" x="480" y="34" width="400" height="347" rx="6"/>
  <text class="pg h2" x="496.5" y="64">集計</text>
  <text class="pg lbl" x="496.5" y="93">月</text>
  <rect class="ctrl" x="496.5" y="98" width="76" height="28" rx="4.8"/>
  <text class="pg ctl" x="502.5" y="116">すべて</text>
  <path class="chev" d="M557.5,110 L561.0,113.5 L564.5,110"/>
  <text class="pg lbl" x="585.5" y="93">種別</text>
  <rect class="ctrl" x="585.5" y="98" width="76" height="28" rx="4.8"/>
  <text class="pg ctl" x="591.5" y="116">すべて</text>
  <path class="chev" d="M646.5,110 L650.0,113.5 L653.5,110"/>
  <text class="pg muted" x="496.5" y="155">収入</text>
  <text class="pg" x="560.5" y="155">230,000円</text>
  <text class="pg muted" x="496.5" y="180">支出</text>
  <text class="pg" x="560.5" y="180">2,000円</text>
  <text class="pg muted" x="496.5" y="205">収支</text>
  <text class="pg inc" x="560.5" y="205">228,000円</text>
  <text class="pg h3" x="496.5" y="238">分類ごとの支出</text>
  <text class="pg" x="496.5" y="261">交通費: 1,200円</text>
  <text class="pg" x="496.5" y="283">食費: 800円</text>
  <text class="pg h3" x="496.5" y="316">入金元ごとの収入</text>
  <text class="pg" x="496.5" y="339">給料: 200,000円</text>
  <text class="pg" x="496.5" y="361">副業: 30,000円</text>
  <path class="flow" d="M424,180 L466,180"/>
  <path class="flow-head" d="M466,180 L459.7,183.0 L459.7,177.0 Z"/>
  <rect class="mark" x="490" y="298" width="200" height="74" rx="3"/>
</svg>
