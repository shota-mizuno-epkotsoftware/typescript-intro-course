  <text class="pg lbl" x="26.5" y="121">メモ</text>
  <rect class="ctrl" x="26.5" y="126" width="136" height="28" rx="4.8"/>
  <rect class="btn" x="175.5" y="123" width="36" height="31" rx="4.8"/>
  <text class="pg" x="193.5" y="143" text-anchor="middle">追加</text>
  <rect class="panel" x="10" y="192" width="537" height="145.2" rx="6"/>
  <text class="pg h2" x="26.5" y="222">明細</text>
  <text class="pg" x="26.5" y="259.0">2026-11-06</text>
  <text class="pg" x="119.5" y="259.0">食費<tspan class="ctl muted"> 昼食</tspan></text>
  <text class="pg exp" x="484.5" y="259.0" text-anchor="end">-800円</text>
  <rect class="btn" x="494.5" y="239.0" width="36" height="31" rx="4.8"/>
  <text class="pg" x="512.5" y="259.0" text-anchor="middle">削除</text>
  <path class="rule" d="M26.5,276.6 H530.5"/>
  <text class="pg" x="26.5" y="303.6">2026-11-05</text>
  <text class="pg" x="119.5" y="303.6">食費（固定費）</text>
  <text class="pg exp" x="484.5" y="303.6" text-anchor="end">-12,000円</text>
  <rect class="btn" x="494.5" y="283.6" width="36" height="31" rx="4.8"/>
  <text class="pg" x="512.5" y="303.6" text-anchor="middle">削除</text>
  <path class="rule" d="M26.5,321.20000000000005 H530.5"/>
  <rect class="mark" x="433.5" y="56" width="46" height="30" rx="3"/>
  <path class="lead" d="M479.5,71 H600"/>
  <text class="note" x="606" y="75">足すチェック欄</text>
  <rect class="mark" x="114" y="284" width="100" height="24" rx="3"/>
  <path class="lead" d="M214,296 C400,296 480,330 600,330"/>
  <text class="note" x="606" y="334">チェックを入れて追加した支出</text>
</svg>
