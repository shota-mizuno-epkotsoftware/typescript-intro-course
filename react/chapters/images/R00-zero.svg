<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 235" width="790" height="235" role="img" aria-labelledby="t d">
  <title id="t">見出しの位置に 0 が表示される</title>
  <desc id="d">集計の区画。種別を「収入」にして、支出が 1 件もない状態。収入・支出・収支のすぐ下の、「分類ごとの支出」の見出しがあった所に、数の 0 が表示されている。</desc>
  <style>
    .pg { font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif; font-size: 12.8px; fill: #1f2328; }
    .h1 { font-size: 20.5px; font-weight: 700; }
    .h2 { font-size: 14px; font-weight: 700; }
    .h3 { font-size: 12.2px; font-weight: 700; fill: #59636e; }
    .lbl { font-size: 10.9px; fill: #59636e; }
    .ctl { font-size: 10.9px; }
    .small { font-size: 11.5px; }
    .muted { fill: #59636e; }
    .inc { fill: #1a7f37; }
    .exp { fill: #b42318; }
    .panel { fill: #ffffff; stroke: #d8dee4; stroke-width: 0.8; }
    .ctrl { fill: #ffffff; stroke: #d8dee4; stroke-width: 0.8; }
    .btn { fill: #f6f7f9; stroke: #d8dee4; stroke-width: 0.8; }
    .rule { fill: none; stroke: #d8dee4; stroke-width: 0.8; }
    .chev { fill: none; stroke: #1f2328; stroke-width: 1; }
    .check { fill: #0b63ce; }
    .tick { fill: none; stroke: #ffffff; stroke-width: 1.6; }
    .hl { fill: #dbeafe; }
    .con { fill: #ffffff; stroke: #c4c7c5; stroke-width: 1; }
    .con-bar { fill: #eef1f4; }
    .con-err { fill: #fdecea; }
    .con-txt { font-family: Menlo, Consolas, "Courier New", monospace; font-size: 10.5px; fill: #1f2328; }
    .con-red { fill: #b42318; }
    .con-ui { font-family: -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif; font-size: 10.5px; fill: #5f6368; }
    .con-on { fill: #0b57d0; font-weight: 700; }
    .codebox { fill: #f6f8fa; stroke: #d8dee4; stroke-width: 0.8; }
    .code { font-family: Menlo, Consolas, "Courier New", monospace; font-size: 11px; fill: #1f2328; }
    .mark { fill: none; stroke: #ea580c; stroke-width: 1.5; }
    .mark-b { fill: none; stroke: #2563eb; stroke-width: 1.5; }
    .lead { fill: none; stroke: #ea580c; stroke-width: 1; }
    .tag { fill: none; stroke: #ea580c; stroke-width: 1.2; }
    .tag-txt { font-family: Menlo, Consolas, "Courier New", monospace; font-size: 11px; font-weight: 700; fill: #c2410c; }
    .note { font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; font-size: 12px; fill: #1f2937; }
    .cap { font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; font-size: 13px; font-weight: 700; fill: #1f2937; }
    .flow { fill: none; stroke: #6b7280; stroke-width: 1.4; }
    .flow-head { fill: #6b7280; }
    @media (prefers-color-scheme: dark) {
      .mark, .lead, .tag { stroke: #fb923c; }
      .mark-b { stroke: #60a5fa; }
      .tag-txt { fill: #fb923c; }
      .note, .cap { fill: #e5e7eb; }
      .flow { stroke: #9ca3af; }
      .flow-head { fill: #9ca3af; }
    }
  </style>
  <rect class="panel" x="10" y="10" width="400" height="213" rx="6"/>
  <text class="pg h2" x="26.5" y="40">集計</text>
  <text class="pg lbl" x="26.5" y="69">月</text>
  <rect class="ctrl" x="26.5" y="74" width="76" height="28" rx="4.8"/>
  <text class="pg ctl" x="32.5" y="92">すべて</text>
  <path class="chev" d="M87.5,86 L91.0,89.5 L94.5,86"/>
  <text class="pg lbl" x="115.5" y="69">種別</text>
  <rect class="ctrl" x="115.5" y="74" width="76" height="28" rx="4.8"/>
  <text class="pg ctl" x="121.5" y="92">収入</text>
  <path class="chev" d="M176.5,86 L180.0,89.5 L183.5,86"/>
  <text class="pg muted" x="26.5" y="131">収入</text>
  <text class="pg" x="90.5" y="131">200,000円</text>
  <text class="pg muted" x="26.5" y="156">支出</text>
  <text class="pg" x="90.5" y="156">0円</text>
  <text class="pg muted" x="26.5" y="181">収支</text>
  <text class="pg inc" x="90.5" y="181">200,000円</text>
  <text class="pg" x="26.5" y="203">0</text>
  <rect class="mark" x="20" y="188" width="26" height="22" rx="3"/>
  <path class="lead" d="M46,199 H440"/>
  <text class="note" x="446" y="203">見出しの代わりに、0 が表示される</text>
</svg>
